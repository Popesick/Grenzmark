      <button data-action="potion-to-unit" data-id="${u.id}" data-potion="healPotions" ${game.pool.healPotions<=0?'disabled':''}>+ Heiltrank (${u.healPotions})</button>
      <button data-action="potion-to-pool" data-id="${u.id}" data-potion="healPotions" ${u.healPotions<=0?'disabled':''}>− Heiltrank</button>
      <button data-action="potion-to-unit" data-id="${u.id}" data-potion="manaPotions" ${game.pool.manaPotions<=0?'disabled':''}>+ Manatrank (${u.manaPotions})</button>
      <button data-action="potion-to-pool" data-id="${u.id}" data-potion="manaPotions" ${u.manaPotions<=0?'disabled':''}>− Manatrank</button>
    </div></div>`;
  });
  html += `<div class="panel-box"><div class="action-row"><button class="primary" data-action="back-to-world">Zurück zur Weltkarte</button></div></div>`;
  return html;
}

function renderSavesScreen(){
  let html = '<div class="map-region"><h2>Spielstände</h2></div>';
  for(let i=1;i<=SAVE_SLOTS;i++){
    const info = getSaveSlotInfo(i);
    html += `<div class="panel-box"><h3>Slot ${i}</h3>`;
    if(info && info.game){
      const g = info.game;
      html += `<div class="help-text">Gespeichert: ${info.savedAt} · Version ${info.version||'?'} · 💰 ${g.gold} Gold · ${g.mercs?g.mercs.length:'?'} Söldner</div>`;
    } else {
      html += `<div class="help-text">Leerer Speicherplatz</div>`;
    }
    html += `<div class="action-row">
      <button data-action="save-slot" data-slot="${i}">Hier speichern</button>
      <button data-action="load-slot" data-slot="${i}" ${info?'':'disabled'}>Laden</button>
      <button class="danger" data-action="delete-slot" data-slot="${i}" ${info?'':'disabled'}>Löschen</button>
    </div></div>`;
  }
  html += `<div class="panel-box"><div class="action-row"><button class="primary" data-action="back-to-world">Zurück zur Weltkarte</button></div></div>`;
  return html;
}

function renderConfirmModal(){
  const loc = pendingLocation;
  const info = getEncounterInfo(loc);
  return `<div class="overlay"><div class="modal">
    <h2>${loc.ref.name}</h2>
    <div class="info-line"><span>Gegner</span><span>${info.count} × ${info.label}</span></div>
    <div class="info-line"><span>Stufe</span><span>${info.levelText}</span></div>
    <div class="info-line"><span>Eigene Kämpfer</span><span>${getActivePlayerRoster().length}</span></div>
    <div class="buttons">
      <button data-action="cancel-loc">Abbrechen</button>
      <button class="primary" data-action="confirm-loc">Einsatz beginnen</button>
    </div>
  </div></div>`;
}

function renderAnnouncementModal(){
  const m = modalQueue[0];
  if(m.action==='mage-choice'){
    const portraitHtml = m.unit ? `<div class="modal-portrait" title="Porträt-Pfad: ${portraitPath(m.unit)}">
        ${portraitImgHtml(m.unit, 'modal-portrait-img', 'modal-portrait-fallback')}
      </div>` : '';
    return `<div class="overlay"><div class="modal" style="text-align:center;">
      ${portraitHtml}
      <h2>Aufstieg</h2>
      <p style="color:var(--text-dim);line-height:1.5;text-align:left;">${m.text}</p>
      <div class="buttons">
        <button class="primary" data-action="mage-choice-select" data-choice="erzmagier" data-unit-id="${m.unit.id}">Erzmagier</button>
        <button class="primary" data-action="mage-choice-select" data-choice="nekromant" data-unit-id="${m.unit.id}">Nekromant</button>
      </div>
    </div></div>`;
  }
  const label = m.action==='restart' ? 'Neu beginnen' : 'Weiter';
  const title = m.action==='restart' ? 'Erfolg!' : 'Neuigkeiten';
  const portraitHtml = m.unit ? `<div class="modal-portrait" title="Porträt-Pfad: ${portraitPath(m.unit)}">
      ${portraitImgHtml(m.unit, 'modal-portrait-img', 'modal-portrait-fallback')}
    </div>` : '';
  return `<div class="overlay"><div class="modal" style="text-align:center;">
    ${portraitHtml}
    <h2>${title}</h2>
    <p style="color:var(--text-dim);line-height:1.5;text-align:left;">${m.text}</p>
    <div class="buttons"><button class="primary" data-action="modal-continue">${label}</button></div>
  </div></div>`;
}

function renderBattleScreen(){
  const canvasPx = GRID_SIZE*zoomTile;
  const phaseLabel = battle.deploying ? 'Aufstellungsphase' : (battle.phase==='player' ? 'Spielerphase — Runde '+battle.turnNumber : 'Gegnerphase');
  let html = `<div class="phase-banner">${phaseLabel}</div>`;
  html += '<div id="battle-wrap">';
  html += '<div class="battle-canvas-column">';
  html += `<div id="battle-canvas-holder" style="width:${canvasPx+16}px;height:${canvasPx+16}px;">
    <canvas id="battleCanvas" width="${canvasPx}" height="${canvasPx}"></canvas>`;
  if(battle.outcome){
    const won = battle.outcome==='victory';
    const label = won ? 'Sieg' : (battle.outcome==='retreat' ? 'Rückzug' : 'Niederlage');
    html += `<div class="result-overlay"><div class="result-box ${won?'victory':'defeat'}">
      <h2>${label}</h2>
      <p style="color:var(--text-dim);max-width:280px;">${won ? 'Die Truppe hat das Schlachtfeld unter Kontrolle. Alle Einheiten werden vollständig geheilt.' : 'Die Truppe zieht sich zurück in die Hauptstadt und wird dort geheilt. Erfahrung bleibt erhalten.'}</p>
      <button class="primary" data-action="end-battle">Weiter</button>
    </div></div>`;
  }
  html += `</div>`;
  html += `<div class="zoom-controls">
    <button class="zoom-btn" data-action="zoom-out" title="Kampfkarte verkleinern" ${zoomTile<=16?'disabled':''}>−</button>
    <button class="zoom-btn" data-action="zoom-in" title="Kampfkarte vergrößern" ${zoomTile>=56?'disabled':''}>+</button>
    <button class="display-toggle-btn" data-action="toggle-sprites" title="Zwischen Grafik und Icon-Darstellung wechseln">${useSprites ? '🖼 Grafik' : '⚪ Icons'}</button>
  </div>`;
  html += '</div>'; // battle-canvas-column
  html += '<div id="battle-side">';

  if(battle.deploying){
    html += `<div class="panel-box"><h3>Aktionen</h3><div class="action-row">
      <button class="primary" data-action="confirm-deploy">Kampf beginnen</button>
    </div></div>`;
    if(battle.deploySelected){
      html += `<div class="panel-box"><h3>Ausgewählt</h3>${unitCardHtml(battle.deploySelected)}</div>`;
    }
    html += `<div class="panel-box"><h3>Kampf-Chronik</h3><div class="battle-log">`;
    game.log.slice(0,10).forEach(l=> html += `<div class="entry">${l}</div>`);
    html += `</div></div>`;
    html += `<div class="panel-box"><h3>Truppen aufstellen</h3><div class="help-text" style="margin-bottom:0;">Klicke eine eigene Einheit an und danach ein Feld in den unteren zwei Reihen (grün markiert), um sie dorthin zu versetzen oder mit einer anderen Einheit zu tauschen. Weiter oben ist keine Aufstellung möglich.</div></div>`;
    html += '</div></div>';
    return html;
  }

  // 1) Aktionen
  html += `<div class="panel-box"><h3>Aktionen</h3><div class="action-row">
    <button data-action="wait" ${battle.mode==='attacking'?'':'disabled'}>Warten</button>
    <button data-action="end-phase" ${(battle.phase==='player' && !battle.outcome)?'':'disabled'}>Phase beenden</button>
    <button class="danger" data-action="retreat" ${(battle.phase==='player' && !battle.outcome)?'':'disabled'}>Rückzug</button>`;
  if(battle.selected && battle.selected.team==='player' && !battle.selected.hasActed){
    const su = battle.selected;
    if(su.healPotions>0 && su.hp<su.maxHp){
      html += `<button data-action="use-potion" data-potion="healPotions">Heiltrank trinken (+5 HP, ${su.healPotions})</button>`;
    }
    if(su.isMage && su.manaPotions>0 && su.mag<su.maxMag){
      html += `<button data-action="use-potion" data-potion="manaPotions">Manatrank trinken (+5 MP, ${su.manaPotions})</button>`;
    }
  }
  html += `</div></div>`;

  // 2) Magie-Menü (nur wenn Magier ausgewählt, genug MP hat und mind. ein Ziel in Reichweite ist)
  if(battle.selected && battle.selected.isMage && battle.selected.team==='player' && !battle.selected.hasActed && mageHasCastableSpell(battle.selected)){
    const mage = battle.selected;
    html += `<div class="panel-box"><h3>Magie (${mage.mag}/${mage.maxMag} MP)${mage.magePath?' · '+(mage.magePath==='erzmagier'?'Erzmagier':'Nekromant'):''}</h3><div class="action-row">`;
    getAvailableSpellKeys(mage).forEach(key=>{
      const spell = getSpellDef(mage,key);
      const cost = spellCostFor(mage,spell);
      const targets = validSpellTargets(mage, key);
      const disabled = mage.mag < cost || targets.length===0;
      const active = battle.castingSpell===key;
      html += `<button data-action="cast-spell" data-spell="${key}" ${disabled?'disabled':''} ${active?'class="primary"':''}>${spell.name} (${cost} MP)</button>`;
    });
    if(battle.mode==='spellTargeting'){
      html += `<button data-action="cancel-spell">Abbruch</button>`;
    }
    html += `</div><div class="help-text" style="margin:8px 0 0;">Feuerball (Reichweite ${mage.magePath==='erzmagier'?3:2}, Schaden) · Verteidigung (Reichweite 3, +${mage.magePath==='erzmagier'?20:10} Verteidigung für 2 Runden) · Heilung (Reichweite 3, +${mage.magePath==='erzmagier'?10:5} HP)${mage.magePath==='nekromant'?' · Schwächen/Manipulieren/Todesfluch (neue Nekromant-Zauber)':''}. Kann vor oder nach der Bewegung gewirkt werden, wie ein Angriff. „Abbruch" wählt keinen Spruch und beendet den Zug.</div></div>`;
  }

  // 3) Charakter (eigene Einheit ausgewählt, oder Gegner inspiziert)
  if(battle.selected){
    html += `<div class="panel-box"><h3>Ausgewählt</h3>${unitCardHtml(battle.selected)}</div>`;
  } else if(battle.inspecting && battle.inspecting.alive){
    html += `<div class="panel-box"><h3>Gegner</h3>${unitCardHtml(battle.inspecting)}</div>`;
  }

  // 4) Kampf-Chronik
  html += `<div class="panel-box"><h3>Kampf-Chronik</h3><div class="battle-log">`;
  game.log.slice(0,10).forEach(l=> html += `<div class="entry">${l}</div>`);
  html += `</div></div>`;

  // 5) Tutorial-/Hilfe-Boxen (ein-/ausblendbar)
  html += `<div class="panel-box"><div class="action-row">
    <button data-action="toggle-tutorial">${showTutorial ? 'Tutorial ausblenden' : 'Tutorial einblenden'}</button>
  </div></div>`;
  if(showTutorial){
    const presentTypes = new Set();
    for(let y=0;y<battle.size;y++) for(let x=0;x<battle.size;x++) presentTypes.add(battle.grid[y][x]);
    html += `<div class="panel-box"><h3>Gelände</h3><div class="legend">`;
    Object.entries(TERRAIN).forEach(([k,t])=>{
      if(!presentTypes.has(k)) return;
      html += `<span><i style="background:${t.color}"></i>${t.name} (${t.cost} BP, +${t.def} Vert.${t.heal?', +'+t.heal+' Heilung/Runde':''})</span>`;
    });
    html += `</div></div>`;

    html += `<div class="panel-box"><h3>Steuerung</h3><div class="help-text" style="margin-bottom:0;">Einheit anklicken, dann entweder ein blaues Feld zum Bewegen wählen oder direkt auf einen angrenzenden Gegner klicken, um ohne Bewegung anzugreifen. Ein Klick auf eine feindliche Einheit (wenn gerade keine eigene aktiv ist) zeigt deren Bewegungsradius in Rot sowie ihre Werte.${battle.specialTiles && battle.specialTiles.length ? ' Gegner versuchen zu Beginn, Wachtürme/Burg zu besetzen und zu halten — wer zuerst dort ist, sichert sich den Verteidigungsbonus.' : ''}</div></div>`;
    html += `<div class="panel-box"><h3>Umzingelung</h3><div class="help-text" style="margin-bottom:0;">Steht neben dem Angreifer noch mind. ein weiterer Verbündeter direkt am Ziel an, steigen Trefferchance (+${FLANK_BONUS.hit} pro zusätzlichem Angreifer) und Schaden (+${FLANK_BONUS.dmg}). Gilt für beide Seiten.</div></div>`;
  }

  html += '</div></div>'; // battle-side, battle-wrap

  return html;
}

function drawBattleCanvas(){
  const canvas = document.getElementById('battleCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const size = battle.size;
  const T = zoomTile;
  const s = T/BASE_TILE; // Skalierungsfaktor für Schrift-/Symbolgrößen relativ zur Standardgröße
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const t = TERRAIN[battle.grid[y][x]];
      ctx.fillStyle = t.color;
      ctx.fillRect(x*T,y*T,T,T);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.strokeRect(x*T,y*T,T,T);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = Math.max(9,Math.round(13*s))+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.icon, x*T+T/2, y*T+T/2);
    }
  }
  // Aufstellungszone (untere zwei Reihen) während der Aufstellungsphase
  if(battle.deploying){
    ctx.fillStyle = 'rgba(95,143,97,0.22)';
    for(let y=size-2;y<size;y++){
      for(let x=0;x<size;x++){
        ctx.fillRect(x*T,y*T,T,T);
      }
    }
  }
  // move range
  if(battle.moveRange){
    ctx.fillStyle = 'rgba(91,122,166,0.45)';
    Object.keys(battle.moveRange).forEach(k=>{
      const [x,y]=k.split(',').map(Number);
      ctx.fillRect(x*T,y*T,T,T);
    });
  }
  // attack range
  if(battle.attackRange){
    ctx.fillStyle = 'rgba(163,69,59,0.55)';
    battle.attackRange.forEach(k=>{
      const [x,y]=k.split(',').map(Number);
      ctx.fillRect(x*T,y*T,T,T);
    });
  }
  // Bewegungsradius einer inspizierten feindlichen Einheit (rot)
  if(battle.inspectRange){
    ctx.fillStyle = 'rgba(163,69,59,0.35)';
    Object.keys(battle.inspectRange).forEach(k=>{
      const [x,y]=k.split(',').map(Number);
      ctx.fillRect(x*T,y*T,T,T);
    });
  }
  // units
  battle.units.filter(u=>u.alive).forEach(u=>{
    const cx = u.x*T+T/2, cy=u.y*T+T/2;
    const sprite = getSprite(spritePath(u));
    const useSprite = useSprites && sprite.loaded && !sprite.failed;
    if(battle.selected===u || battle.deploySelected===u || battle.inspecting===u) { ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,14*s,0,Math.PI*2); ctx.stroke(); }
    if(useSprite){
      ctx.drawImage(sprite.img, u.x*T, u.y*T, T, T);
    } else {
      let fill = u.team==='enemy' ? '#a3453b' : (u.isAlly ? '#5f8f61' : (u.isMage ? '#7a5ea8' : '#c6a153'));
      ctx.fillStyle=fill;
      ctx.beginPath(); ctx.arc(cx,cy,11*s,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle= u.team==='enemy' ? '#fff' : '#1a1408';
      ctx.font='bold '+Math.max(8,Math.round(11*s))+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(u.isMage ? 'M' : WEAPON_LETTER[u.weapon], cx, cy+1);
    }
    // hp bar
    const pct = Math.max(0,u.hp/u.maxHp);
    const barH = Math.max(2,Math.round(3*s));
    ctx.fillStyle='#111528'; ctx.fillRect(u.x*T+4*s,u.y*T+2*s,T-8*s,barH);
    ctx.fillStyle= pct>0.5?'#5f8f61':(pct>0.25?'#c6a153':'#a3453b');
    ctx.fillRect(u.x*T+4*s,u.y*T+2*s,(T-8*s)*pct,barH);
    if(u.hasActed){
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.fillRect(u.x*T,u.y*T,T,T);
    }
  });
  // Schadens-/Treffer-Anzeigen der letzten Aktion
  if(battle.damagePopups && battle.damagePopups.length){
    const tileCounts = {};
    battle.damagePopups.forEach(p=>{
      const key=p.x+','+p.y;
      const idx = tileCounts[key]||0; tileCounts[key]=idx+1;
      const px = p.x*T+T/2, py = p.y*T - 4*s - idx*14*s;
      ctx.font='bold '+Math.max(10,Math.round(13*s))+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.6)';
      ctx.strokeText(p.text, px, py);
      ctx.fillStyle=p.color;
      ctx.fillText(p.text, px, py);
    });
  }
  canvas.onclick = (evt)=>{
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const x = Math.floor(((evt.clientX-rect.left)*scaleX)/T);
    const y = Math.floor(((evt.clientY-rect.top)*scaleY)/T);
    if(x<0||y<0||x>=size||y>=size) return;
    onTileClick(x,y);
  };
}

/* ===================== Event-Delegation ===================== */
function attachHandlers(){
  appEl.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const action = el.getAttribute('data-action');
      if(action==='newgame'){ if(confirm('Neues Spiel starten? Der aktuelle Fortschritt geht verloren.')) { initGame(); render(); } }
      else if(action==='start-game'){ screen='world'; render(); }
      else if(action==='toggle-music'){ toggleMusic(); render(); }
      else if(action==='toggle-sfx'){ toggleSfx(); render(); }
      else if(action==='zoom-in'){ zoomIn(); }
      else if(action==='zoom-out'){ zoomOut(); }
      else if(action==='toggle-sprites'){ toggleSprites(); }
      else if(action==='toggle-tutorial'){ toggleTutorial(); }
      else if(action==='select-loc'){
        const kind = el.getAttribute('data-kind');
        const idx = Number(el.getAttribute('data-idx'));
        const ref = kind==='village' ? game.world.villages[idx]
          : kind==='camp' ? game.world.camps[idx]
          : kind==='castle' ? game.world.castles[idx]
          : kind==='rumor' ? game.rumor.camps[idx]
          : kind==='feldlager' ? game.fieldCamp
          : kind==='spaeher' ? game.scoutPatrol
          : game.offensive.camps[idx];
        if(kind==='feldlager' && !game.offensive.camps.every(c=>c.cleared)){
          if(!confirm('Die Versorgungslager unterstützen das Feldlager mit Männern und Ausrüstung. Bist du sicher, dass du das Feldlager jetzt schon attackieren möchtest?')){
            return;
          }
        }
        pendingLocation = {kind, ref};
        screen='confirm';
        render();
      }
      else if(action==='open-shop'){ screen='shop'; render(); }
      else if(action==='open-camp'){ screen='camp'; render(); }
      else if(action==='open-saves'){ screen='saves'; render(); }
      else if(action==='save-slot'){ saveGameToSlot(Number(el.getAttribute('data-slot'))); }
      else if(action==='load-slot'){
        if(confirm('Diesen Spielstand laden? Der aktuelle, nicht gespeicherte Fortschritt geht dabei verloren.')){
          loadGameFromSlot(Number(el.getAttribute('data-slot')));
        }
      }
      else if(action==='delete-slot'){
        if(confirm('Diesen Spielstand wirklich löschen?')) deleteSaveSlot(Number(el.getAttribute('data-slot')));
      }
      else if(action==='back-to-world'){ screen='world'; render(); }
      else if(action==='buy-potion'){ buyPotion(el.getAttribute('data-potion')); render(); }
      else if(action==='hire-mercenary'){ hireMercenary(); render(); }
      else if(action==='buy-weapon'){ buyWeaponTier(el.getAttribute('data-weapon'), el.getAttribute('data-tier')); render(); }
      else if(action==='buy-armor'){ buyArmorTier(el.getAttribute('data-tier')); render(); }
      else if(action==='equip-weapon'){ const u=findUnitById(el.getAttribute('data-id')); if(u) setWeaponTier(u, el.getAttribute('data-tier')); render(); }
      else if(action==='equip-armor'){ const u=findUnitById(el.getAttribute('data-id')); if(u) setArmorTier(u, el.getAttribute('data-tier')); render(); }
      else if(action==='potion-to-unit'){ const u=findUnitById(el.getAttribute('data-id')); if(u) movePotionToUnit(u, el.getAttribute('data-potion')); render(); }
      else if(action==='potion-to-pool'){ const u=findUnitById(el.getAttribute('data-id')); if(u) movePotionToPool(u, el.getAttribute('data-potion')); render(); }
      else if(action==='cancel-loc'){ pendingLocation=null; screen='world'; render(); }
      else if(action==='confirm-loc'){
        // Roderick schließt sich wieder an, sobald man sich erneut den Banditen zuwendet —
        // er soll direkt in diesem Kampf schon mitkämpfen, nicht erst danach.
        if(pendingLocation.kind==='village' || pendingLocation.kind==='camp'){
          rejoinFirstAllyBeforeBattle();
        }
        generateBattle(pendingLocation); screen='battle'; render();
      }
      else if(action==='wait'){ waitAction(); }
      else if(action==='use-potion'){ usePotionInBattle(el.getAttribute('data-potion')); }
      else if(action==='end-phase'){ endPlayerPhase(); }
      else if(action==='retreat'){ if(confirm('Wirklich zurückziehen? Dies zählt als Niederlage für die Weltkonsequenzen.')) retreatBattle(); }
      else if(action==='confirm-deploy'){ confirmDeployment(); }
      else if(action==='cast-spell'){ startCastingSpell(el.getAttribute('data-spell')); }
      else if(action==='cancel-spell'){ abortMageTurn(); }
      else if(action==='end-battle'){ endBattle(battle.outcome); }
      else if(action==='modal-continue'){
        const m = modalQueue.shift();
        if(m){
          if(m.action==='restart'){ initGame(); }
          else if(m.onClose){ m.onClose(); }
        }
        if(modalQueue.length) playSfx('ping');
        render();
      }
      else if(action==='mage-choice-select'){
        const uid = el.getAttribute('data-unit-id');
        const choice = el.getAttribute('data-choice');
        const u = findUnitById(uid);
        if(u) applyMagePromotionChoice(u, choice);
        modalQueue.shift();
        if(modalQueue.length) playSfx('ping');
        render();
      }
    });
  });
}

initGame();
screen = 'intro'; // Intro nur beim allerersten Laden zeigen (initGame setzt sonst 'world')
render();
