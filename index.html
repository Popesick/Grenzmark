<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronik der Grenzmark – Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131829;
  --bg-alt:#0e1220;
  --panel:#1c2440;
  --panel-alt:#242e50;
  --line:#3a4570;
  --line-soft:#2a3358;
  --text:#e7e2cf;
  --text-dim:#98a0c4;
  --gold:#c6a153;
  --gold-dim:#8a7539;
  --danger:#a3453b;
  --danger-dim:#6e332d;
  --success:#5f8f61;
  --success-dim:#3f5f41;
  --info:#5b7aa6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Spectral',serif;height:100%;}
#app{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:.02em;font-weight:600;color:var(--gold);}
button{font-family:'Spectral',serif;cursor:pointer;border-radius:3px;border:1px solid var(--line);background:var(--panel-alt);color:var(--text);padding:8px 14px;font-size:14px;transition:background .15s,border-color .15s;}
button:hover:not(:disabled){background:var(--line-soft);border-color:var(--gold-dim);}
button:disabled{opacity:.35;cursor:default;}
button.primary{background:var(--gold-dim);border-color:var(--gold);color:#1a1408;font-weight:600;}
button.primary:hover:not(:disabled){background:var(--gold);}
button.danger{border-color:var(--danger);}
button.danger:hover:not(:disabled){background:var(--danger-dim);}

/* header */
#intro-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1c2440,#0a0d18);padding:20px;}
.intro-inner{text-align:center;max-width:720px;}
.intro-title{font-size:34px;margin:0 0 20px;}
.intro-sub{color:var(--text-dim);font-size:15px;line-height:1.7;margin-bottom:30px;}
.intro-video-wrap{margin-bottom:26px;}
.intro-video-wrap video{width:100%;max-width:680px;border-radius:6px;border:1px solid var(--line);background:#000;display:block;margin:0 auto;}
.intro-video-fallback{color:var(--text-dim);font-size:14px;font-style:italic;margin-bottom:0;}
#header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--bg-alt);border-bottom:1px solid var(--line);}
#header h1{margin:0;font-size:21px;}
#header .sub{color:var(--text-dim);font-size:13px;margin-top:2px;}
#header .right{display:flex;align-items:center;gap:14px;}
.day-badge{font-family:'Cinzel',serif;color:var(--gold);border:1px solid var(--line);padding:5px 12px;border-radius:3px;font-size:13px;}

/* layout */
#main{flex:1;display:flex;min-height:0;}
#sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow-y:auto;}
#content{flex:1;padding:20px;overflow-y:auto;position:relative;}

.roster-card{background:var(--panel-alt);border:1px solid var(--line-soft);border-radius:4px;padding:9px;margin-bottom:8px;display:flex;gap:10px;align-items:stretch;}
.roster-card.dead{opacity:.4;}
.roster-card .card-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.roster-card .row1{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.roster-card .name{font-weight:600;font-size:14px;}
.roster-card .rank{font-size:11px;color:var(--text-dim);}
.roster-card .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--text-dim);flex:0 0 auto;}
.roster-card .badge.weapon-SCHWERT{border-color:#8fa8c9;color:#8fa8c9;}
.roster-card .badge.weapon-AXT{border-color:#c98f6b;color:#c98f6b;}
.roster-card .badge.weapon-SPEER{border-color:#a7c98f;color:#a7c98f;}
.roster-card .badge.weapon-MAGIE{border-color:#a78bc9;color:#a78bc9;}
.portrait-wrap{flex:0 0 46%;border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--line-soft);background:#111528;align-self:stretch;min-height:78px;}
.portrait-img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;}
.portrait-fallback{width:100%;height:100%;display:none;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:26px;color:var(--gold);background:linear-gradient(135deg,#2a3358,#1c2440);position:absolute;inset:0;}
.modal-portrait{width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto 14px;position:relative;border:2px solid var(--gold-dim);background:#111528;}
.modal-portrait-img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;}
.modal-portrait-fallback{width:100%;height:100%;display:none;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:26px;color:var(--gold);background:linear-gradient(135deg,#2a3358,#1c2440);position:absolute;inset:0;}
.statline{display:flex;gap:8px;font-size:11px;color:var(--text-dim);margin-top:4px;flex-wrap:wrap;}
.statline-compact{display:flex;gap:8px;font-size:11px;color:var(--text-dim);margin-top:4px;flex-wrap:wrap;}
.stat-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-top:4px;}
.stat-row .stat-label{flex:0 0 20px;}
.stat-row .stat-num{flex:0 0 auto;min-width:40px;color:var(--text);}
.mini-bar{flex:1;height:6px;border-radius:3px;background:#111528;overflow:hidden;border:1px solid var(--line-soft);}
.mini-bar-fill{height:100%;}
.mini-bar-fill.hp{background:linear-gradient(90deg,var(--success),#7fb37f);}
.mini-bar-fill.mp{background:linear-gradient(90deg,#5a4a8f,#a78bc9);}
.mini-bar-fill.xp{background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
.hpbar-outer,.xpbar-outer{height:6px;border-radius:3px;background:#111528;overflow:hidden;margin-top:5px;border:1px solid var(--line-soft);}
.hpbar-inner{height:100%;background:linear-gradient(90deg,var(--success),#7fb37f);}
.xpbar-inner{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));}

#logbox{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:10px;}
#logbox h3{font-size:12px;margin:0 0 6px;color:var(--text-dim);text-transform:none;}
#logbox .entry{font-size:12px;color:var(--text-dim);margin-bottom:5px;line-height:1.4;}
#logbox .entry:first-child{color:var(--text);}

/* world map */
.map-region{margin-bottom:26px;}
.map-region h2{font-size:15px;margin:0 0 12px;font-weight:600;}
.map-region h2 .hint{color:var(--text-dim);font-size:12px;font-family:'Spectral',serif;font-weight:400;margin-left:8px;}
.node-row{display:flex;gap:12px;flex-wrap:wrap;}
.node{width:150px;background:var(--panel-alt);border:1px solid var(--line-soft);border-radius:4px;padding:12px;text-align:left;}
.node.clickable{cursor:pointer;border-color:var(--gold-dim);}
.node.clickable:hover{border-color:var(--gold);background:var(--line-soft);}
.node.locked{opacity:.45;}
.node.success{border-color:var(--success);}
.node.danger{border-color:var(--danger);}
.node .n-name{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:5px;}
.node .n-state{font-size:12px;color:var(--text-dim);}
.node .siegebar{height:5px;border-radius:3px;background:#111528;margin-top:8px;overflow:hidden;border:1px solid var(--line-soft);}
.node .siegebar-inner{height:100%;background:linear-gradient(90deg,var(--success),var(--danger));}
.capital-node{width:100%;max-width:340px;margin:0 auto;text-align:center;padding:20px;background:radial-gradient(ellipse at center,#26305a,#1a2140);border:1px solid var(--gold-dim);border-radius:6px;}
.capital-node .n-name{font-size:16px;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,8,16,.72);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:6px;padding:26px 30px;width:380px;max-width:90vw;}
.modal h2{margin-top:0;}
.modal .info-line{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin:6px 0;border-bottom:1px solid var(--line-soft);padding-bottom:6px;}
.modal .buttons{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}

/* battle */
#battle-wrap{display:flex;gap:18px;align-items:flex-start;}
#battle-canvas-holder{background:var(--bg-alt);border:1px solid var(--line);border-radius:4px;padding:8px;position:relative;flex:0 0 auto;}
.battle-canvas-column{display:flex;flex-direction:column;align-items:center;gap:12px;flex:0 0 auto;}
.zoom-controls{display:flex;flex-direction:row;gap:12px;justify-content:center;align-items:center;flex:0 0 auto;}
.zoom-btn{position:relative;width:38px;height:38px;border-radius:50%;border:2px solid var(--gold-dim);background:var(--panel-alt);color:var(--gold);font-size:18px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.zoom-btn:hover:not(:disabled){border-color:var(--gold);background:var(--line-soft);}
.zoom-btn:disabled{opacity:.35;cursor:default;}
.zoom-btn::after{content:'';position:absolute;width:14px;height:3px;background:var(--gold-dim);border-radius:2px;bottom:-7px;right:-7px;transform:rotate(45deg);}
.display-toggle-btn{border-radius:16px;border:1px solid var(--line);background:var(--panel-alt);color:var(--text);font-size:12px;padding:8px 14px;cursor:pointer;}
.display-toggle-btn:hover{border-color:var(--gold-dim);background:var(--line-soft);}
canvas{display:block;border-radius:2px;}
#battle-side{width:300px;flex:0 0 300px;}
.panel-box{background:var(--panel-alt);border:1px solid var(--line-soft);border-radius:4px;padding:12px;margin-bottom:12px;}
.panel-box h3{margin:0 0 8px;font-size:13px;color:var(--gold);font-family:'Cinzel',serif;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--text-dim);}
.legend span{display:flex;align-items:center;gap:4px;}
.legend i{width:10px;height:10px;display:inline-block;border-radius:2px;}
.phase-banner{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);text-align:center;padding:6px;border:1px solid var(--line-soft);border-radius:4px;margin-bottom:12px;background:var(--panel);}
.battle-log{max-height:150px;overflow-y:auto;font-size:12px;color:var(--text-dim);}
.battle-log .entry{margin-bottom:4px;border-left:2px solid var(--line-soft);padding-left:6px;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;}
.result-overlay{position:absolute;inset:0;background:rgba(6,8,16,.85);display:flex;align-items:center;justify-content:center;border-radius:4px;}
.result-box{background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:26px 34px;text-align:center;}
.result-box.victory{border-color:var(--success);}
.result-box.defeat{border-color:var(--danger);}
.result-box h2{font-size:22px;margin-top:0;}

.help-text{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}
.small-note{font-size:11px;color:var(--text-dim);margin-top:8px;font-style:italic;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== Konstanten / Datendefinitionen ===================== */
const TERRAIN = {
  STRASSE:  {cost:1, def:0,  heal:0, color:'#7a6a48', icon:'▬', name:'Straße'},
  WIESE:    {cost:2, def:1,  heal:0, color:'#4d6a3c', icon:'❈', name:'Wiese'},
  FELD:     {cost:3, def:1,  heal:0, color:'#7c7a3a', icon:'≡', name:'Feld'},
  WALD:     {cost:4, def:3,  heal:0, color:'#294a2c', icon:'♣', name:'Wald'},
  GEBIRGE:  {cost:8, def:5,  heal:0, color:'#5c5548', icon:'▲', name:'Gebirge'},
  DORF:     {cost:1, def:1,  heal:2, color:'#caa457', icon:'⌂', name:'Dorfplatz'},
  WACHTURM: {cost:1, def:6,  heal:0, color:'#6b5c42', icon:'♜', name:'Wachturm'},
  BURG:     {cost:1, def:10, heal:3, color:'#9a8560', icon:'♛', name:'Burghof'}
};
const WEAPON_TRIANGLE = { SCHWERT:'AXT', AXT:'SPEER', SPEER:'SCHWERT' }; // Schlüssel schlägt Wert
const WEAPON_LETTER = { SCHWERT:'S', AXT:'A', SPEER:'P' };
const WEAPON_NAME = { SCHWERT:'Schwert', AXT:'Axt', SPEER:'Speer' };
const WEAPON_COLOR = { SCHWERT:'#8fa8c9', AXT:'#c98f6b', SPEER:'#a7c98f' };
const WEAPON_SPRITE_SLUG = { SCHWERT:'sword', AXT:'axe', SPEER:'pole' };

/* ===================== Kampfkarten-Sprites ===================== */
// Bildpfad je Einheit: eigene Kämpfer <waffe>[_f].png, Banditen bandit_<waffe>[_f].png,
// feindliche Söldner (Burgen) hostile_<waffe>[_f].png. Magier immer "magic". Fehlt eine
// Grafik, wird automatisch auf den bisherigen Kreis-Platzhalter zurückgefallen.
function spriteSlugForUnit(u){
  return u.isMage ? 'magic' : (WEAPON_SPRITE_SLUG[u.weapon] || 'sword');
}
function spritePrefixForUnit(u){
  if(u.team!=='enemy') return '';
  return u.enemyKind==='hostile' ? 'hostile_' : 'bandit_';
}
function spritePath(u){
  const prefix = spritePrefixForUnit(u);
  const slug = spriteSlugForUnit(u);
  const female = u.gender==='w' ? '_f' : '';
  return `graphics/sprites/${prefix}${slug}${female}.png`;
}
const SPRITE_CACHE = {};
function getSprite(path){
  let entry = SPRITE_CACHE[path];
  if(!entry){
    const img = new Image();
    entry = { img, loaded:false, failed:false };
    img.onload = ()=>{ entry.loaded=true; if(screen==='battle') render(); };
    img.onerror = ()=>{ entry.failed=true; };
    img.src = path;
    SPRITE_CACHE[path] = entry;
  }
  return entry;
}
const WEAPON_TRIANGLE_BONUS = { hit:12, dmg:2 }; // konfigurierbar (Spec: 10-15 / 1-2)
const FLANK_BONUS = { hit:10, dmg:2 }; // pro zusätzlichem angrenzenden Verbündeten am Ziel (konfigurierbar, Erweiterung über die Spec hinaus)

/* ===================== Ausrüstung / Ökonomie ===================== */
const WEAPON_TIER_BONUS = {
  stahl:     { atk:0,  def:0,  spd:0 },
  silber:    { atk:5,  def:3,  spd:2 },
  elementar: { atk:10, def:5,  spd:5 }
};
const ARMOR_TIER_BONUS = {
  wolle:     { atk:0, def:0,  spd:0 },
  leder:     { atk:0, def:5,  spd:0 },
  eisen:     { atk:0, def:15, spd:-5 },
  silber:    { atk:0, def:25, spd:0 },
  elementar: { atk:5, def:50, spd:5 }
};
const WEAPON_TIER_PRICE = { silber:4000, elementar:10000 }; // +100%
const ARMOR_TIER_PRICE = { leder:1000, eisen:4000, silber:10000, elementar:20000 }; // +100%
const POTION_PRICE = 25;
function computeEquipBonus(u){
  const w = WEAPON_TIER_BONUS[u.weaponTier||'stahl'];
  const a = ARMOR_TIER_BONUS[u.armorTier||'wolle'];
  return { atk:w.atk+a.atk, def:w.def+a.def, spd:w.spd+a.spd };
}
function reapplyEquipBonus(u){
  const old = u.equipBonusApplied || {atk:0,def:0,spd:0};
  u.atk -= old.atk; u.def -= old.def; u.spd -= old.spd;
  const now = computeEquipBonus(u);
  u.atk += now.atk; u.def += now.def; u.spd += now.spd;
  u.equipBonusApplied = now;
}
function setWeaponTier(u, tier){
  if(tier!=='stahl' && !game.shop.weaponTiers[u.weapon][tier]) return;
  u.weaponTier = tier;
  reapplyEquipBonus(u);
}
function setArmorTier(u, tier){
  if(tier!=='wolle' && !game.shop.armorTiers[tier]) return;
  u.armorTier = tier;
  reapplyEquipBonus(u);
}
function buyWeaponTier(weaponType, tier){
  const price = WEAPON_TIER_PRICE[tier];
  if(game.shop.weaponTiers[weaponType][tier] || game.gold<price) return;
  game.gold -= price;
  game.shop.weaponTiers[weaponType][tier] = true;
  logMsg(`${tier==='silber'?'Silber':'Elementar'}-${WEAPON_NAME[weaponType]} für die Truppe erworben.`);
}
function buyArmorTier(tier){
  const price = ARMOR_TIER_PRICE[tier];
  if(game.shop.armorTiers[tier] || game.gold<price) return;
  game.gold -= price;
  game.shop.armorTiers[tier] = true;
  logMsg(`${ARMOR_TIER_NAME[tier]} für die Truppe erworben.`);
}
function buyPotion(kind){
  if(game.gold<POTION_PRICE) return;
  game.gold -= POTION_PRICE;
  game.pool[kind]++;
}
function movePotionToUnit(u, kind){
  if(game.pool[kind]<=0) return;
  game.pool[kind]--; u[kind]++;
}
function movePotionToPool(u, kind){
  if(u[kind]<=0) return;
  u[kind]--; game.pool[kind]++;
}
const ARMOR_TIER_NAME = { wolle:'Wollrüstung', leder:'Lederrüstung', eisen:'Eisenrüstung', silber:'Silberrüstung', elementar:'Elementarrüstung' };
const WEAPON_TIER_NAME = { stahl:'Stahl', silber:'Silber', elementar:'Elementar' };
const BASE_TILE = 32;
let zoomTile = BASE_TILE; // per +/- Lupe im Kampfbildschirm veränderbar
function zoomIn(){ zoomTile = Math.min(56, zoomTile+4); render(); }
function zoomOut(){ zoomTile = Math.max(16, zoomTile-4); render(); }
let useSprites = true; // Grafik- vs. Icon-Darstellung auf der Kampfkarte
function toggleSprites(){ useSprites = !useSprites; render(); }
let showTutorial = true; // Ein-/Ausblenden der Tutorial-/Hilfe-Boxen im Kampf
function toggleTutorial(){ showTutorial = !showTutorial; render(); }
const GRID_SIZE = 14; // Prototyp-Standard (Spec-Default 25x25, hier verkleinert & weiterhin konfigurierbar)
const GAME_VERSION = '0.3.1'; // Trigger-Fix, Feldlager-Überfälle auf gesicherte Burgen, Joric-Aufstiegswahl, Speicherfixe
const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function formatDate(monthIndex){
  const total = 9 + monthIndex; // Start: Oktober (Index 9) 503
  const year = 503 + Math.floor(total/12);
  const name = MONTH_NAMES[((total%12)+12)%12];
  return `${name} ${year} n.d.E.`;
}

/* ===================== Musik & Soundeffekte ===================== */
// Sucht im Ordner "audio" (relativ zur HTML-Datei) nach den Musik- und Effekt-Dateien.
// Fehlt eine Datei, wird das Fehlen still ignoriert (nur Konsolen-Hinweis).
const AUDIO_FILES = { overworld:'audio/overworld.mp3', battle:'audio/battle.mp3' };
const AUDIO = {};
Object.entries(AUDIO_FILES).forEach(([key, path])=>{
  const a = new Audio(path);
  a.loop = true;
  a.volume = 0.45;
  a.preload = 'auto';
  a.__unavailable = false;
  a.addEventListener('error', ()=>{
    a.__unavailable = true;
    console.warn(`Musikdatei "${path}" wurde nicht gefunden – Wiedergabe übersprungen.`);
  });
  AUDIO[key] = a;
});

const SFX_FILES = {
  hit:      'audio/effects/hit.mp3',
  death_m1: 'audio/effects/death_m1.mp3',
  death_m2: 'audio/effects/death_m2.mp3',
  death_w1: 'audio/effects/death_w1.mp3',
  death_w2: 'audio/effects/death_w2.mp3',
  ping:     'audio/effects/ping.mp3',
  fireball: 'audio/effects/fireball.mp3',
  healing:  'audio/effects/healing.mp3',
  shield:   'audio/effects/shield.mp3'
};
const SFX = {};
Object.entries(SFX_FILES).forEach(([key, path])=>{
  const a = new Audio(path);
  a.preload = 'auto';
  a.volume = 0.7;
  a.__unavailable = false;
  a.addEventListener('error', ()=>{
    a.__unavailable = true;
    console.warn(`Soundeffekt-Datei "${path}" wurde nicht gefunden – Wiedergabe übersprungen.`);
  });
  SFX[key] = a;
});

let musicEnabled = true;
let sfxEnabled = true;
let musicKind = null; // aktuell aktiver Musiktrack: 'overworld' | 'battle' | null
let audioUnlocked = false;

// Einmaliges "Entsperren" der Audiowiedergabe beim allerersten Klick/Tastendruck.
// Browser blockieren Audio-Autoplay, bis eine echte Nutzerinteraktion stattgefunden hat;
// ohne diesen Trick bleibt die Musik stumm, bis man zufällig einen Button erwischt,
// der die Wiedergabe erneut anstößt (z.B. durch Aus-/wieder Einschalten).
function unlockAudioOnce(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  [...Object.values(AUDIO), ...Object.values(SFX)].forEach(a=>{
    const p = a.play();
    if(p && p.then){ p.then(()=>{ a.pause(); try{ a.currentTime=0; }catch(e){} }).catch(()=>{ audioUnlocked=false; }); }
    else { a.pause(); }
  });
  applyMusic();
}
document.addEventListener('pointerdown', unlockAudioOnce, {once:true});
document.addEventListener('keydown', unlockAudioOnce, {once:true});

function desiredMusicKind(){
  return screen==='battle' ? 'battle' : 'overworld';
}

function applyMusic(){
  if(screen==='intro'){
    // Während des Intro-Videos läuft keine separate Hintergrundmusik (Video bringt eigenen Ton mit).
    Object.values(AUDIO).forEach(a=>a.pause());
    musicKind = null;
    return;
  }
  const desired = desiredMusicKind();
  if(desired !== musicKind){
    Object.values(AUDIO).forEach(a=>{ a.pause(); });
    musicKind = desired;
    const a = AUDIO[desired];
    if(a && !a.__unavailable) { try{ a.currentTime = 0; }catch(e){} }
  }
  if(!musicEnabled){
    Object.values(AUDIO).forEach(a=>a.pause());
    return;
  }
  const a = AUDIO[desired];
  if(!a || a.__unavailable) return;
  if(a.paused && !a.ended){
    const p = a.play();
    if(p && p.catch) p.catch(()=>{ /* Autoplay evtl. noch durch Browser blockiert, bis zur nächsten Nutzerinteraktion */ });
  }
}
function toggleMusic(){
  musicEnabled = !musicEnabled;
  applyMusic();
}
function toggleSfx(){
  sfxEnabled = !sfxEnabled;
}
function playSfx(key){
  if(!sfxEnabled) return;
  const src = SFX[key];
  if(!src || src.__unavailable) return;
  // cloneNode erlaubt überlappende Wiedergabe (z.B. mehrere Treffer kurz hintereinander)
  const node = src.cloneNode(true);
  node.volume = src.volume;
  const p = node.play();
  if(p && p.catch) p.catch(()=>{});
}
function playDeathSfx(unit){
  const variant = Math.random()<0.5 ? 1 : 2;
  const key = (unit.gender==='w' ? 'death_w' : 'death_m') + variant;
  playSfx(key);
}



/* ===================== RNG ===================== */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 1779033703 ^ s.length;
  for(let i=0;i<s.length;i++){
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function getActivePlayerRoster(){
  const list=[...game.mercs];
  if(game.firstAlly.joined && game.firstAlly.active) list.push(game.firstAlly.unit);
  if(game.secondAlly.joined) list.push(game.secondAlly.unit);
  return list;
}
function findUnitById(id){
  return getActivePlayerRoster().find(u=>u.id===id);
}
function effectiveLevel(u){ return u.promoted ? u.level+20 : u.level; }
function xpMultiplier(attacker, defender){
  // Gegner gleich stark oder ±1 Level: normale EXP. Darüber hinaus gestaffelter Bonus/Malus.
  const diff = effectiveLevel(defender) - effectiveLevel(attacker); // positiv = Gegner stärker
  if(diff>=2) return 1 + Math.min(90,(diff-1)*10)/100;
  if(diff<=-2) return 1 - Math.min(90,(-diff)*10)/100;
  return 1;
}
function getStrongestPartyLevel(){
  const roster = getActivePlayerRoster();
  if(!roster.length) return 1;
  return Math.max(...roster.map(effectiveLevel));
}
function getAveragePartyLevel(){
  const roster = getActivePlayerRoster();
  if(!roster.length) return 1;
  return roster.reduce((a,u)=>a+effectiveLevel(u),0)/roster.length;
}
function getWeakestPartyUnit(){
  const roster = getActivePlayerRoster();
  if(!roster.length) return null;
  return roster.reduce((min,u)=> effectiveLevel(u)<effectiveLevel(min) ? u : min, roster[0]);
}
function mercenaryPrice(){
  const weakest = getWeakestPartyUnit();
  return (weakest && weakest.promoted) ? 3000 : 2000;
}
function hireMercenary(){
  const weakest = getWeakestPartyUnit();
  if(!weakest) return;
  const price = mercenaryPrice();
  if(game.gold<price) return;
  game.gold -= price;
  const usedNames = new Set(game.mercs.map(m=>m.name));
  usedNames.add(game.excludedMageName);
  const merc = createLeveledMerc(Math.max(1,weakest.level), usedNames);
  game.mercs.push(merc);
  logMsg(`${merc.name} (Level ${merc.level}) wird für ${price} Gold als Söldner angeworben.`);
}

function checkNextStageTrigger(){
  // Regel: Ist die Belagerung der Burgen aktuell beendet (keine Burg gerade aktiv belagert)
  // UND sind die Banditen im Westen besiegt (alle Dörfer befreit, alle Lager zerstört),
  // werden Gegenschlag, Gerüchte-Questreihe und Feldlager gemeinsam ausgelöst.
  if(game.offensive.unlocked) return;
  const noActiveSiege = game.world.castles.every(c=>!c.fallen && c.siege===0);
  const banditsDefeated = game.world.villages.every(v=>v.liberated) && game.world.camps.every(c=>c.cleared);
  if(!(noActiveSiege && banditsDefeated)) return;
  const usedNames = new Set(game.mercs.map(m=>m.name));
  usedNames.add(game.excludedMageName);
  const merc = createLeveledMerc(10, usedNames);
  game.mercs.push(merc);
  logMsg(`${merc.name} (Level 10) schließt sich als Verstärkung des Königs der Truppe an.`);
  queueModal(
    `Der König lobt euren Erfolg an der Nordgrenze. Er trägt euch auf, den Gegenschlag zu unterstützen und in feindliches Gebiet vorzudringen. ${merc.name} (Level 10) schließt sich als Verstärkung eurer Truppe an.`,
    ()=>{ game.offensive.unlocked=true; }, 'dismiss', merc
  );
  game.rumor.unlocked = true;
  game.rumor.actionsSince = 0;
  queueModal('Gerüchte wabern umher, dass eine geheimnisvolle Macht die Angreifer aus ihren Landen vertrieben hat. Gehe den Gerüchten nach.');
  game.fieldCamp.unlocked = true;
  game.scoutPatrol.unlocked = true;
  queueModal('Kundschafter melden ein feindliches Feldlager jenseits der Grenze. Solange es besteht, könnten die Burgen erneut angegriffen werden.');
}

  if(game.offensive.completed) return;
  if(game.offensive.camps.every(c=>c.cleared)){
    game.offensive.completed=true;
    logMsg('Der Gegenschlag ist abgeschlossen. Die Versorgungslager des Feindes sind ausgehoben.');
    queueModal('Der Gegenschlag ist abgeschlossen. Die Versorgungslager des Feindes sind ausgehoben.');
  }
  checkGameCompleted();
}
function checkRumorCompleted(){
  if(!game.rumor || game.rumor.completed) return;
  if(game.rumor.camps.every(c=>c.cleared)){
    game.rumor.completed=true;
    queueModal('Die geheimnisvolle Macht ist ergründet. Auch dieser Gerüchtefaden ist zu Ende erzählt.');
  }
  checkGameCompleted();
}
function checkGameCompleted(){
  // Das "Missionen abgeschlossen"-Ende darf erst kommen, wenn wirklich ALLE Handlungsstränge
  // abgeschlossen sind — nicht schon nach dem dritten Versorgungslager.
  if(game.completed) return;
  const villagesDone = game.world.villages.every(v=>v.liberated);
  const campsDone = game.world.camps.every(c=>c.cleared);
  const castlesDone = game.world.activeCastle >= game.world.castles.length && game.world.castles.every(c=>!c.fallen);
  const offensiveDone = game.offensive.camps.every(c=>c.cleared);
  const rumorDone = game.rumor.camps.every(c=>c.cleared);
  const fieldCampDone = !game.fieldCamp.unlocked || game.fieldCamp.destroyed;
  const scoutDone = !game.scoutPatrol.unlocked || game.scoutPatrol.cleared;
  if(villagesDone && campsDone && castlesDone && offensiveDone && rumorDone && fieldCampDone && scoutDone){
    game.completed = true;
    queueModal('Missionen abgeschlossen! Die Grenzmark ist gesichert und der Gegenschlag erfolgreich.', null, 'restart');
  }
}

/* ===================== XP / Level / Beförderung ===================== */
function applyXP(unit, amount){
  if(unit.level>=20 && unit.rank!=='Söldner' && unit.rank!=='Verbündeter' && unit.rank!=='Verbündete'){ /* Hauptmann max */ }
  if(unit.level>=20 && unit.promoted){ unit.xp=0; return; }
  unit.xp += amount;
  while(unit.xp>=100){
    if(unit.level>=20 && unit.promoted){ unit.xp=0; break; }
    unit.xp-=100;
    levelUp(unit);
    if(unit.level>=20 && unit.promoted){ unit.xp=0; break; }
  }
}
function levelUp(unit){
  unit.level++;
  const g=()=>randInt(0,2);
  unit.atk+=g(); unit.def+=g(); unit.spd+=g();
  const hpg=g(); unit.maxHp+=hpg; unit.hp=Math.min(unit.maxHp,unit.hp+hpg);
  if(unit.isMage){
    const magGain = randInt(0,3);
    unit.maxMag+=magGain; unit.mag=Math.min(unit.maxMag,unit.mag+magGain);
  }
  logMsg(`${unit.name} erreicht Level ${unit.level}.`);
  if(unit.level>=20 && !unit.promoted){
    if(unit.isMage){
      queueModal(`${unit.name} hat Level 20 erreicht. Erzmagier: alle Zauber wirken doppelt so stark, kosten aber dreimal so viel Mana; Feuerball erhält Reichweite 3 und eine Chance auf Feuerschaden. Nekromant: erlernt drei neue dunkle Zauber (Schwächen, Manipulieren, Todesfluch). Wähle den Aufstiegspfad für ${unit.name}.`, null, 'mage-choice', unit);
    } else {
      promote(unit);
    }
  }
}
function applyMagePromotionChoice(unit, choice){
  unit.promoted = true;
  unit.level = 1;
  unit.magePath = choice;
  const b=()=>randInt(1,5);
  unit.atk+=b(); unit.def+=b(); unit.spd+=b();
  const hb=b(); unit.maxHp+=hb; unit.hp=unit.maxHp;
  const magGain=b(); unit.maxMag+=magGain; unit.mag=unit.maxMag;
  if(choice==='erzmagier'){
    unit.rank='Erzmagier';
    logMsg(`${unit.name} steigt zum Erzmagier auf! Alle Zauber wirken doppelt so stark, kosten aber dreimal so viel Mana.`);
  } else {
    unit.rank='Nekromant';
    logMsg(`${unit.name} steigt zum Nekromanten auf und erlernt neue, dunkle Zauber.`);
  }
}
function promote(unit){
  unit.promoted=true;
  unit.level=1;
  unit.rank = unit.isMage ? 'Erzmagier' : 'Hauptmann';
  const b=()=>randInt(1,5);
  unit.atk+=b(); unit.def+=b(); unit.spd+=b();
  const hb=b(); unit.maxHp+=hb; unit.hp=unit.maxHp;
  if(unit.isMage){
    const magGain = b();
    unit.maxMag+=magGain; unit.mag=unit.maxMag;
  }
  logMsg(`${unit.name} wird zum ${unit.rank} befördert!`);
}

function advanceCastleSiege(amount){
  const idx = game.world.activeCastle;
  if(idx>=game.world.castles.length) return;
  const castle = game.world.castles[idx];
  if(castle.fallen) return; // diese Burg wartet schon auf Rückeroberung, hier greift kein weiterer Belagerungsfortschritt
  castle.siege = Math.min(100, castle.siege+amount);
  if(castle.siege>=100){
    castle.fallen=true;
    logMsg(`${castle.name} ist gefallen! Die Belagerung wurde durchbrochen.`);
    // Die Front rückt trotzdem weiter vor — die nächste Burg gerät unter Beschuss,
    // auch wenn die gefallene noch nicht zurückerobert wurde.
    game.world.activeCastle = idx+1;
  }
}
function siegeLabel(v){
  if(v>=100) return 'Gefallen';
  if(v>=67) return 'Kurz vor dem Fall';
  if(v>=34) return 'Stark belagert';
  if(v>=1) return 'Belagert';
  return 'Sicher';
}

/* ===================== Kampfarena-Generierung ===================== */
function enemySingular(loc){
  if(loc.kind==='village' || loc.kind==='camp') return 'Bandit';
  if(loc.kind==='castle') return loc.ref.fallen ? 'Verteidiger' : 'Belagerer';
  if(loc.kind==='supply') return 'Soldat';
  if(loc.kind==='rumor') return 'Schattenkrieger';
  if(loc.kind==='feldlager') return 'Soldat';
  if(loc.kind==='spaeher') return 'Späher';
  return 'Gegner';
}
function enemyPlural(loc){
  if(loc.kind==='village' || loc.kind==='camp') return 'Banditen';
  if(loc.kind==='castle') return loc.ref.fallen ? 'Verteidiger' : 'Belagerer';
  if(loc.kind==='supply') return 'Soldaten';
  if(loc.kind==='rumor') return 'Schattenkrieger';
  if(loc.kind==='feldlager') return 'Soldaten & Kampfmagier';
  if(loc.kind==='spaeher') return 'Späher';
  return 'Gegner';
}
function getFieldCampStats(){
  const clearedCount = game.offensive.camps.filter(c=>c.cleared).length;
  const soldiers = Math.max(0, 20 - 3*clearedCount);
  let level = getStrongestPartyLevel()+2 - clearedCount;
  if(clearedCount>=3) level -= 1;
  return { soldiers, level: Math.max(1, level) };
}
function getEnemyGroups(loc){
  if(loc.kind==='village'){
    // Schwierigkeit richtet sich nach der Reihenfolge, in der der Spieler Dörfer befreit (nicht nach Dorf-Index).
    const tier = Math.min(game.world.villageWinCount+1, 3);
    let groups;
    if(tier===1) groups=[{count:5, level:1, weapons:['AXT']}];
    else if(tier===2) groups=[{count:5, level:2, weapons:['AXT']}];
    else groups=[{count:2, level:2, weapons:['AXT']}, {count:3, level:3, weapons:['AXT']}];
    if(loc.ref.occupation>=100){
      const maxLvl = Math.max(...groups.map(g=>g.level));
      groups = [...groups, {count:5, level:maxLvl+2, weapons:['AXT']}];
    }
    return groups;
  }
  if(loc.kind==='camp'){
    // Feste Level je Stützpunkt (nach Index, nicht nach Reihenfolge des Spielers).
    const campLevels = [ [[4,3],[4,4]], [[10,4]], [[6,8],[6,9]] ];
    const groups = campLevels[loc.ref.idx].map(([count,level])=>({count, level, weapons:['AXT']}));
    if(loc.ref.idx===2){
      groups.push({count:1, level:12, weapons:['AXT'], isLeader:true});
    }
    return groups;
  }
  if(loc.kind==='castle'){
    if(loc.ref.fallen){
      return [
        {count:10, level:5, weapons:['SCHWERT','SPEER']},
        {count:6, level:getStrongestPartyLevel(), weapons:['SCHWERT','AXT','SPEER']}
      ];
    }
    return [{count:10, level:5, weapons:['SCHWERT','SPEER']}];
  }
  if(loc.kind==='supply'){
    return [{count:10, level:Math.max(1,Math.round(getAveragePartyLevel()-1)), weapons:['SCHWERT','AXT','SPEER']}];
  }
  if(loc.kind==='rumor'){
    const avg = getAveragePartyLevel();
    if(loc.ref.idx===0){
      const immediate = game.rumor.actionsSince===0;
      const lvl = Math.max(1, Math.round(avg - (immediate?3:2)));
      return [{count:15, level:lvl, weapons:['SCHWERT','AXT','SPEER']}];
    }
    const lvl2 = Math.max(1, Math.round(avg-1));
    return [{count:15, level:lvl2, weapons:['SCHWERT','AXT','SPEER']}];
  }
  if(loc.kind==='feldlager'){
    const stats = getFieldCampStats();
    const groups = [];
    if(stats.soldiers>0) groups.push({count:stats.soldiers, level:stats.level, weapons:['SCHWERT','AXT','SPEER']});
    groups.push({count:2, level:stats.level, weapons:['SCHWERT'], isMage:true});
    return groups;
  }
  if(loc.kind==='spaeher'){
    return [{count:5, level:Math.max(1,getStrongestPartyLevel()+1), weapons:['SPEER']}];
  }
  return [];
}
function getEncounterInfo(loc){
  const groups = getEnemyGroups(loc);
  const count = groups.reduce((a,g)=>a+g.count,0);
  const levels = [...new Set(groups.map(g=>g.level))].sort((a,b)=>a-b);
  return { count, levelText: levels.join(' / '), label: enemyPlural(loc) };
}

function carveRoad(grid, size, rng){
  // Zeichnet einen zusammenhängenden Straßenpfad von Süden nach Norden
  // (echter Weg statt zufällig verstreuter Einzelfelder).
  let x = Math.floor(rng()*size), y = size-1;
  grid[y][x] = 'STRASSE';
  let steps = 0;
  while(y>0 && steps < size*6){
    steps++;
    const moves=[];
    moves.push([0,-1,3]);
    if(x>0) moves.push([-1,0,1]);
    if(x<size-1) moves.push([1,0,1]);
    const total = moves.reduce((a,m)=>a+m[2],0);
    let r = rng()*total, chosen=moves[0];
    for(const m of moves){ if(r<m[2]){ chosen=m; break; } r-=m[2]; }
    x = Math.max(0, Math.min(size-1, x+chosen[0]));
    y = Math.max(0, Math.min(size-1, y+chosen[1]));
    grid[y][x] = 'STRASSE';
  }
}
function placeSpecialCluster(grid, size, rng, rows, burgCount, towerCount){
  const cand=[];
  for(const y of rows) for(let x=0;x<size;x++) cand.push([x,y]);
  for(let i=cand.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [cand[i],cand[j]]=[cand[j],cand[i]]; }
  const chosen = cand.slice(0, burgCount+towerCount);
  const tiles=[];
  chosen.forEach(([x,y],idx)=>{
    const type = idx<burgCount ? 'BURG' : 'WACHTURM';
    grid[y][x]=type;
    tiles.push({x,y,type});
    if(type==='BURG') ensureRoadAdjacent(grid,size,x,y);
  });
  return tiles;
}
function ensureRoadAdjacent(grid, size, x, y){
  // Dörfer und Burgen sollen immer an ein Straßenfeld grenzen.
  const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  const hasRoad = dirs.some(([dx,dy])=>{
    const nx=x+dx, ny=y+dy;
    return nx>=0 && ny>=0 && nx<size && ny<size && grid[ny][nx]==='STRASSE';
  });
  if(hasRoad) return;
  for(const [dx,dy] of dirs){
    const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=size||ny>=size) continue;
    const t = grid[ny][nx];
    if(t==='DORF'||t==='BURG'||t==='WACHTURM') continue;
    grid[ny][nx]='STRASSE';
    return;
  }
}

function generateBattle(loc){
  const seed = hashStr(loc.kind+'-'+loc.ref.id+'-'+(loc.ref.fallen?'fallen':'aktiv'));
  const rng = mulberry32(seed);
  const size = GRID_SIZE;
  let weights;
  if(loc.kind==='village' || loc.kind==='supply') weights=[['WIESE',45],['FELD',30],['WALD',20],['GEBIRGE',5]];
  else if(loc.kind==='camp') weights=[['WIESE',20],['FELD',15],['WALD',55],['GEBIRGE',10]];
  else weights=[['WIESE',35],['FELD',15],['WALD',15],['GEBIRGE',35]]; // Burg
  const totalW = weights.reduce((a,[,w])=>a+w,0);
  function pickTerrain(){
    let r=rng()*totalW;
    for(const [t,w] of weights){ if(r<w) return t; r-=w; }
    return weights[0][0];
  }
  const grid=[];
  for(let y=0;y<size;y++){ const row=[]; for(let x=0;x<size;x++) row.push(pickTerrain()); grid.push(row); }
  // Spawnzonen begehbar halten
  for(let x=0;x<size;x++){
    for(const y of [0,1,size-2,size-1]){
      if(grid[y][x]==='GEBIRGE') grid[y][x]='WIESE';
    }
  }
  // Verbundene Straßen statt zufälliger Einzelfelder
  carveRoad(grid,size,rng);
  if(loc.kind==='castle') carveRoad(grid,size,rng);

  // Besondere Felder je nach Einsatzort
  let specialTiles = [];
  if(loc.kind==='village'){
    const midRow = Math.floor(size/2);
    const dx = Math.floor(rng()*size);
    grid[midRow][dx] = 'DORF';
    ensureRoadAdjacent(grid,size,dx,midRow);
  } else if(loc.kind==='camp'){
    specialTiles = placeSpecialCluster(grid,size,rng,[0,1,2],0,3);
  } else if(loc.kind==='castle'){
    if(loc.ref.fallen){
      // Burg ist in Feindeshand: Burghof + 5 Wachtürme im Norden, von der KI umkämpft.
      specialTiles = placeSpecialCluster(grid,size,rng,[0,1,2],1,5);
    } else {
      // Verteidigung: Burghof + 5 Wachtürme im Süden als eigene Rückzugs-/Heilzone.
      placeSpecialCluster(grid,size,rng,[size-3,size-2,size-1],1,5);
    }
  } else if(loc.kind==='feldlager'){
    // Feste Wachturm-Anordnung: Reihe "x_x_x" direkt gefolgt von "_x_x_".
    const row1 = Math.min(size-2, 5), row2 = row1+1;
    const startCol = Math.max(0, Math.floor((size-5)/2));
    [0,2,4].forEach(off=>{ const x=startCol+off; if(x<size){ grid[row1][x]='WACHTURM'; specialTiles.push({x,y:row1,type:'WACHTURM'}); } });
    [1,3].forEach(off=>{ const x=startCol+off; if(x<size){ grid[row2][x]='WACHTURM'; specialTiles.push({x,y:row2,type:'WACHTURM'}); } });
  }

  const roster = getActivePlayerRoster();
  roster.forEach(u=>{ u.alive=true; u.hp=u.maxHp; u.hasMoved=false; u.hasActed=false; u.team='player'; u.defBuff=0; u.defBuffRounds=0; });

  const groups = getEnemyGroups(loc);
  const enemyKind = (loc.kind==='village' || loc.kind==='camp') ? 'bandit' : 'hostile';
  const enemies=[];
  let counter=0;
  groups.forEach(g=>{
    for(let i=0;i<g.count;i++){
      const w = g.weapons[Math.floor(rng()*g.weapons.length)];
      const bonus = g.level-1;
      const maxHp = Math.floor(rng()*11)+15+bonus*3;
      const isMage = !!g.isMage;
      const maxMag = isMage ? (Math.floor(rng()*9)+11) : 0;
      enemies.push({
        id:'e'+counter, name: g.isLeader ? 'Bandenanführer' : (isMage ? 'Kampfmagier '+(counter+1) : enemySingular(loc)+' '+(counter+1)),
        team:'enemy', isAlly:false, isMage, enemyKind, gender: rng()<0.5?'m':'w', weapon:w, level:g.level, rank: g.isLeader ? 'Anführer' : (isMage?'Magier':'Gegner'),
        atk:Math.floor(rng()*10)+1+bonus, def:Math.floor(rng()*10)+1+bonus, spd:Math.floor(rng()*10)+1+bonus, mag:maxMag, maxMag,
        maxHp, hp:maxHp, xp:0, x:0,y:0, alive:true, hasMoved:false, hasActed:false
      });
      counter++;
    }
  });

  function findSpawnTiles(rows, count){
    const cand=[];
    for(const y of rows) for(let x=0;x<size;x++) if(TERRAIN[grid[y][x]].cost<=2) cand.push([x,y]);
    for(let i=cand.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [cand[i],cand[j]]=[cand[j],cand[i]]; }
    return cand;
  }
  const pSpawns = findSpawnTiles([size-1,size-2], roster.length);
  roster.forEach((u,i)=>{ const s=pSpawns[i]||[i%size,size-1]; u.x=s[0]; u.y=s[1]; });
  if(loc.kind==='feldlager'){
    // Magier sollen immer in der zweiten Reihe stehen, übrige Truppen in Reihe 1 und 3.
    const mages = enemies.filter(e=>e.isMage);
    const others = enemies.filter(e=>!e.isMage);
    const mageSpawns = findSpawnTiles([1], mages.length);
    mages.forEach((e,i)=>{ const s=mageSpawns[i]||[i%size,1]; e.x=s[0]; e.y=s[1]; });
    const otherSpawns = findSpawnTiles([0,2], others.length);
    others.forEach((e,i)=>{ const s=otherSpawns[i]||[i%size,0]; e.x=s[0]; e.y=s[1]; });
  } else {
    const eSpawns = findSpawnTiles([0,1,2], enemies.length);
    enemies.forEach((e,i)=>{ const s=eSpawns[i]||[i%size,0]; e.x=s[0]; e.y=s[1]; });
  }

  battle = {
    loc, grid, size, units:[...roster,...enemies], specialTiles,
    phase:'player', mode:'idle', selected:null, moveRange:null, attackRange:null,
    turnNumber:1, enemyIdx:0, outcome:null, lastAttackerId:null,
    deploying:true, deploySelected:null, castingSpell:null,
    damagePopups:[], inspecting:null, inspectRange:null
  };
}

/* ===================== Kampf-Logik ===================== */
function unitAt(x,y){ return battle.units.find(u=>u.alive && u.x===x && u.y===y); }
function occupiedKeys(exclude){
  const s=new Set();
  battle.units.forEach(u=>{ if(u.alive && u!==exclude) s.add(u.x+','+u.y); });
  return s;
}
function computeReachable(unit){
  const bp = bpForSpeed(unit.spd);
  const occ = occupiedKeys(unit);
  const dist = {}; const startKey = unit.x+','+unit.y; dist[startKey]=0;
  const queue = [{x:unit.x,y:unit.y,cost:0}];
  while(queue.length){
    queue.sort((a,b)=>a.cost-b.cost);
    const cur = queue.shift();
    const key = cur.x+','+cur.y;
    if(cur.cost > (dist[key] ?? Infinity)) continue;
    const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
    for(const [dx,dy] of dirs){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(nx<0||ny<0||nx>=battle.size||ny>=battle.size) continue;
      const nkey = nx+','+ny;
      if(occ.has(nkey)) continue;
      const terrain = TERRAIN[battle.grid[ny][nx]];
      const ncost = cur.cost + terrain.cost;
      if(ncost<=bp && ncost < (dist[nkey] ?? Infinity)){
        dist[nkey]=ncost;
        queue.push({x:nx,y:ny,cost:ncost});
      }
    }
  }
  return dist;
}
function triangleMod(atkW, defW){
  if(WEAPON_TRIANGLE[atkW]===defW) return {hit:WEAPON_TRIANGLE_BONUS.hit, dmg:WEAPON_TRIANGLE_BONUS.dmg};
  if(WEAPON_TRIANGLE[defW]===atkW) return {hit:-WEAPON_TRIANGLE_BONUS.hit, dmg:-WEAPON_TRIANGLE_BONUS.dmg};
  return {hit:0, dmg:0};
}
function countFlankers(attacker, defender){
  // Zählt zusätzliche angrenzende Einheiten desselben Teams wie der Angreifer,
  // die ebenfalls an das Ziel angrenzen (Umzingelung). Maximal 3 (4 Seiten - Angreifer-Seite).
  let n=0;
  [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{
    const u = unitAt(defender.x+dx, defender.y+dy);
    if(u && u!==attacker && u.team===attacker.team) n++;
  });
  return n;
}
function pushDamagePopup(x,y,text,color){
  if(!battle) return;
  battle.damagePopups.push({x,y,text,color});
}
function attackOnce(attacker, defender, isCounter){
  if(battle) battle.lastAttackerId = attacker.id;
  const terrainDef = TERRAIN[battle.grid[defender.y][defender.x]].def;
  // Magier gelten im Nahkampf immer als unterlegene Waffe, unabhängig vom getragenen Waffentyp.
  const tri = attacker.isMage
    ? { hit:-WEAPON_TRIANGLE_BONUS.hit, dmg:-WEAPON_TRIANGLE_BONUS.dmg }
    : triangleMod(attacker.weapon, defender.weapon);
  const flank = countFlankers(attacker, defender);
  let hitChance = 70 + (attacker.spd - defender.spd) + tri.hit + flank*FLANK_BONUS.hit;
  if(isCounter) hitChance -= 20;
  hitChance = Math.max(5, Math.min(95, hitChance));
  const hit = Math.random()*100 < hitChance;
  playSfx('hit');
  const xpMult = xpMultiplier(attacker, defender);
  applyXP(attacker, Math.max(1,Math.round(randInt(5,10)*xpMult)));
  if(hit){
    let atkVal = attacker.atk;
    if(isCounter) atkVal = atkVal*0.8;
    let dmg = Math.round(atkVal) + tri.dmg + flank*FLANK_BONUS.dmg - defender.def - (defender.defBuff||0) - terrainDef;
    dmg = Math.max(1, dmg);
    defender.hp -= dmg;
    pushDamagePopup(defender.x, defender.y, '-'+dmg, '#ff6b5e');
    const flankNote = flank>0 ? ` [Umzingelt von ${flank} weiteren ${attacker.team==='enemy'?'Gegnern':'Verbündeten'}: +Schaden/Trefferchance]` : '';
    logMsg(`${attacker.name} trifft ${defender.name} (${dmg} Schaden).${flankNote}`);
    if(defender.hp<=0){
      defender.hp=0; defender.alive=false;
      applyXP(attacker, Math.max(1,Math.round(randInt(20,40)*xpMult)));
      logMsg(`${defender.name} wurde besiegt.`);
      playDeathSfx(defender);
      return {died:true};
    }
  } else {
    pushDamagePopup(defender.x, defender.y, 'Verfehlt', '#9aa3c4');
    logMsg(`${attacker.name} verfehlt ${defender.name}.`);
  }
  return {died:false};
}
function resolveCombat(attacker, defender){
  if(battle) battle.damagePopups = [];
  const r1 = attackOnce(attacker, defender, false);
  if(!r1.died && defender.alive && attacker.alive && defender.spd >= attacker.spd){
    attackOnce(defender, attacker, true);
  }
  if(attacker.alive && defender.alive && (attacker.spd - defender.spd) >= 10){
    attackOnce(attacker, defender, false);
  }
  checkBattleEnd();
}
function checkBattleEnd(){
  if(battle.outcome) return;
  const enemiesAlive = battle.units.some(u=>u.team==='enemy' && u.alive);
  const playersAlive = battle.units.some(u=>u.team==='player' && u.alive);
  if(!enemiesAlive){ battle.outcome='victory'; logMsg('Sieg! Alle Gegner wurden besiegt.'); }
  else if(!playersAlive){ battle.outcome='defeat'; logMsg('Niederlage! Die Truppe wurde überwältigt.'); }
}

/* ===================== Magie ===================== */
const SPELLS = {
  feuerball:    { name:'Feuerball',    cost:2, range:2, targetTeam:'enemy' },
  verteidigung: { name:'Verteidigung', cost:3, range:3, targetTeam:'ally'  },
  heilung:      { name:'Heilung',      cost:2, range:3, targetTeam:'ally'  }
};
const NEKROMANT_SPELLS = {
  schwaechen:   { name:'Schwächen',     cost:10, range:3, targetTeam:'enemy' },
  manipulieren: { name:'Manipulieren',  cost:15, range:2, targetTeam:'enemy' },
  todesfluch:   { name:'Todesfluch',    cost:12, range:3, targetTeam:'enemy' }
};
function getSpellDef(mage, key){
  return SPELLS[key] || (mage.magePath==='nekromant' ? NEKROMANT_SPELLS[key] : null);
}
function getAvailableSpellKeys(mage){
  const keys = Object.keys(SPELLS);
  if(mage.magePath==='nekromant') keys.push(...Object.keys(NEKROMANT_SPELLS));
  return keys;
}
function spellRangeFor(mage, key, spell){
  if(key==='feuerball' && mage.magePath==='erzmagier') return 3; // Erzmagier: erweiterte Feuerball-Reichweite
  return spell.range;
}
function spellCostFor(mage, spell){
  return mage.magePath==='erzmagier' ? spell.cost*3 : spell.cost;
}
function manhattan(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }
function validSpellTargets(mage, spellKey){
  const spell = getSpellDef(mage, spellKey);
  if(!spell) return [];
  const range = spellRangeFor(mage, spellKey, spell);
  return battle.units.filter(u=>{
    if(!u.alive) return false;
    if(spell.targetTeam==='enemy' && u.team===mage.team) return false;
    if(spell.targetTeam==='ally' && u.team!==mage.team) return false;
    return manhattan(mage,u) <= range;
  });
}
function mageHasCastableSpell(mage){
  return getAvailableSpellKeys(mage).some(key => {
    const spell = getSpellDef(mage,key);
    return mage.mag>=spellCostFor(mage,spell) && validSpellTargets(mage,key).length>0;
  });
}
function applyWeaken(target){
  removeWeaken(target);
  const atkCut = Math.round(target.atk*0.5), defCut = Math.round(target.def*0.5), spdCut = Math.round(target.spd*0.5);
  target.atk -= atkCut; target.def -= defCut; target.spd -= spdCut;
  target.weakenApplied = {atk:atkCut, def:defCut, spd:spdCut};
  target.weakenRounds = 3;
}
function removeWeaken(target){
  if(target.weakenApplied){
    target.atk += target.weakenApplied.atk;
    target.def += target.weakenApplied.def;
    target.spd += target.weakenApplied.spd;
    target.weakenApplied = null;
  }
  target.weakenRounds = 0;
}
function castSpell(mage, target, spellKey){
  const spell = getSpellDef(mage, spellKey);
  if(!spell) return;
  const cost = spellCostFor(mage, spell);
  if(mage.mag < cost) return;
  mage.mag -= cost;
  battle.damagePopups = [];
  const dmgMult = mage.magePath==='erzmagier' ? 2 : 1;
  if(spellKey==='feuerball'){
    const terrainDef = TERRAIN[battle.grid[target.y][target.x]].def;
    // Magie gilt gegen nicht-magische Gegner immer als überlegene Waffe im Sinne des Waffendreiecks.
    const tri = target.isMage ? {hit:0, dmg:0} : {hit:WEAPON_TRIANGLE_BONUS.hit, dmg:WEAPON_TRIANGLE_BONUS.dmg};
    let hitChance = 70 + (mage.spd - target.spd) + tri.hit;
    hitChance = Math.max(5, Math.min(95, hitChance));
    playSfx('fireball');
    const xpMult = xpMultiplier(mage, target);
    applyXP(mage, Math.max(1,Math.round(randInt(5,10)*xpMult)));
    if(Math.random()*100 < hitChance){
      let dmg = Math.round(mage.atk*dmgMult) + tri.dmg - target.def - (target.defBuff||0) - terrainDef;
      dmg = Math.max(1, dmg);
      target.hp -= dmg;
      pushDamagePopup(target.x, target.y, '-'+dmg, '#ff6b5e');
      logMsg(`${mage.name} trifft ${target.name} mit einem Feuerball (${dmg} Schaden).`);
      if(mage.magePath==='erzmagier' && Math.random()<0.30){
        target.burnRounds = 3;
        logMsg(`${target.name} steht in Flammen.`);
      }
      if(target.hp<=0){
        target.hp=0; target.alive=false;
        applyXP(mage, Math.max(1,Math.round(randInt(20,40)*xpMult)));
        logMsg(`${target.name} wurde besiegt.`);
        playDeathSfx(target);
      }
    } else {
      pushDamagePopup(target.x, target.y, 'Verfehlt', '#9aa3c4');
      logMsg(`${mage.name}s Feuerball verfehlt ${target.name}.`);
    }
    checkBattleEnd();
  } else if(spellKey==='verteidigung'){
    playSfx('shield');
    target.defBuff = 10*dmgMult;
    target.defBuffRounds = 2;
    logMsg(`${mage.name} verstärkt die Verteidigung von ${target.name} um ${target.defBuff} (für 2 Runden).`);
    applyXP(mage, Math.round(randInt(5,10)/2));
  } else if(spellKey==='heilung'){
    playSfx('healing');
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp+5*dmgMult);
    logMsg(`${mage.name} heilt ${target.name} um ${target.hp-before} HP.`);
    applyXP(mage, 10);
  } else if(spellKey==='schwaechen'){
    applyWeaken(target);
    logMsg(`${mage.name} schwächt ${target.name} — Werte für 3 Runden halbiert.`);
    applyXP(mage, randInt(5,10));
  } else if(spellKey==='manipulieren'){
    target.manipulateRounds = 3;
    logMsg(`${mage.name} manipuliert ${target.name} — kämpft für 3 Runden gegen die eigenen Kameraden.`);
    applyXP(mage, randInt(5,10));
  } else if(spellKey==='todesfluch'){
    target.curseRounds = 3;
    logMsg(`${mage.name} belegt ${target.name} mit dem Todesfluch.`);
    applyXP(mage, randInt(5,10));
  }
  mage.hasActed = true;
  battle.selected=null; battle.attackRange=null; battle.moveRange=null; battle.castingSpell=null; battle.mode='idle';
  render();
}

/* Spieler-Interaktion */
function adjacentOpponents(u){
  const oppTeam = u.team==='enemy' ? 'player' : 'enemy';
  const res=[];
  [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{
    const t=unitAt(u.x+dx,u.y+dy);
    if(t && t.team===oppTeam) res.push(t);
  });
  return res;
}
function adjacentEnemies(u){ return adjacentOpponents(u); }
function selectUnit(u){
  battle.inspecting=null; battle.inspectRange=null;
  battle.selected=u;
  battle.moveRange=computeReachable(u);
  const targets = adjacentEnemies(u);
  battle.attackRange = targets.length ? new Set(targets.map(t=>t.x+','+t.y)) : null;
  battle.mode='moving';
  render();
}
function deselect(){
  battle.selected=null; battle.moveRange=null; battle.attackRange=null; battle.mode='idle';
  render();
}
function inspectUnit(u){
  battle.selected=null; battle.moveRange=null; battle.attackRange=null; battle.mode='idle';
  battle.inspecting=u;
  battle.inspectRange=computeReachable(u);
  render();
}
function clearInspect(){
  battle.inspecting=null; battle.inspectRange=null;
  render();
}
function moveSelectedTo(x,y){
  const u = battle.selected;
  u.x=x; u.y=y; u.hasMoved=true;
  battle.moveRange=null;
  if(u.team==='player' && battle.grid[y][x]==='DORF' && !battle.villageMessageShown){
    battle.villageMessageShown = true;
    queueModal('Die Dorfbewohner sind erfreut über eueren Besuch und unterstützen euch in euerem Kampf. Rastet hier, um Lebenspunkte wieder herzustellen.');
  }
  const targets = adjacentEnemies(u);
  const canCast = u.isMage && mageHasCastableSpell(u);
  if(targets.length){
    battle.attackRange=new Set(targets.map(t=>t.x+','+t.y));
    battle.mode='attacking';
  } else if(canCast){
    battle.attackRange=null;
    battle.mode='attacking';
  } else {
    u.hasActed=true;
    battle.selected=null; battle.attackRange=null; battle.mode='idle';
  }
  render();
}
function attackFromCurrentPosition(target){
  // Angriff ohne vorherige Bewegung, direkt aus der aktuellen Position heraus.
  const u = battle.selected;
  u.hasMoved=true;
  battle.moveRange=null;
  resolveCombat(u, target);
  if(u.alive) u.hasActed=true;
  if(!battle.outcome){ battle.selected=null; battle.attackRange=null; battle.mode='idle'; }
  render();
}
function performPlayerAttack(target){
  const u=battle.selected;
  resolveCombat(u,target);
  if(u.alive) u.hasActed=true;
  if(!battle.outcome){ battle.selected=null; battle.attackRange=null; battle.mode='idle'; }
  render();
}
function waitAction(){
  if(battle.selected) battle.selected.hasActed=true;
  battle.selected=null; battle.attackRange=null; battle.mode='idle';
  render();
}
function usePotionInBattle(kind){
  const u = battle.selected;
  if(!u || u.hasActed || u[kind]<=0) return;
  u[kind]--;
  if(kind==='healPotions'){
    const before=u.hp; u.hp=Math.min(u.maxHp,u.hp+5);
    logMsg(`${u.name} trinkt einen Heiltrank (+${u.hp-before} HP).`);
    pushDamagePopup(u.x,u.y,'+'+(u.hp-before),'#5f8f61');
  } else {
    const before=u.mag; u.mag=Math.min(u.maxMag,u.mag+5);
    logMsg(`${u.name} trinkt einen Manatrank (+${u.mag-before} MP).`);
    pushDamagePopup(u.x,u.y,'+'+(u.mag-before),'#a78bc9');
  }
  u.hasActed = true;
  battle.selected=null; battle.moveRange=null; battle.attackRange=null; battle.mode='idle';
  render();
}
function startCastingSpell(spellKey){
  const mage = battle.selected;
  if(!mage || !mage.isMage || mage.hasActed) return;
  const spell = getSpellDef(mage, spellKey);
  if(!spell || mage.mag < spellCostFor(mage,spell)) return;
  battle.castingSpell = spellKey;
  battle.moveRange = null;
  battle.attackRange = new Set(validSpellTargets(mage, spellKey).map(t=>t.x+','+t.y));
  battle.mode = 'spellTargeting';
  render();
}
function cancelSpellTargeting(){
  // Ungültiger Klick während der Zielauswahl (z.B. Fehlklick): zurück zur vorherigen Auswahl, Zug läuft weiter.
  const u = battle.selected;
  battle.castingSpell = null;
  if(u && !u.hasActed){
    battle.moveRange = u.hasMoved ? null : computeReachable(u);
    const targets = adjacentEnemies(u);
    battle.attackRange = targets.length ? new Set(targets.map(t=>t.x+','+t.y)) : null;
    battle.mode = u.hasMoved ? 'attacking' : 'moving';
  } else {
    battle.selected=null; battle.moveRange=null; battle.attackRange=null; battle.mode='idle';
  }
  render();
}
function abortMageTurn(){
  // "Abbruch"-Button: bewusst keinen Spruch wirken, Zug des Magiers endet sofort (analog "Warten").
  const u = battle.selected;
  battle.castingSpell = null;
  if(u) u.hasActed = true;
  battle.selected=null; battle.moveRange=null; battle.attackRange=null; battle.mode='idle';
  render();
}
function handleDeployClick(x,y){
  const inZone = y >= battle.size-2;
  const clicked = unitAt(x,y);
  if(!battle.deploySelected){
    if(clicked && clicked.team==='player'){ battle.deploySelected = clicked; render(); }
    return;
  }
  const sel = battle.deploySelected;
  if(!inZone){ battle.deploySelected=null; render(); return; }
  if(clicked && clicked!==sel && clicked.team==='player'){
    const tx=clicked.x, ty=clicked.y;
    clicked.x=sel.x; clicked.y=sel.y;
    sel.x=tx; sel.y=ty;
  } else if(!clicked){
    sel.x=x; sel.y=y;
  }
  battle.deploySelected=null;
  render();
}
function confirmDeployment(){
  if(!battle) return;
  battle.deploying=false;
  battle.deploySelected=null;
  render();
}
function onTileClick(x,y){
  if(battle.deploying){ handleDeployClick(x,y); return; }
  if(battle.phase!=='player' || battle.outcome) return;
  if(battle.mode==='idle'){
    const u=unitAt(x,y);
    if(u && u.team==='player' && !u.hasActed){ selectUnit(u); }
    else if(u && u.team==='enemy'){
      if(battle.inspecting===u){ clearInspect(); } else { inspectUnit(u); }
    } else if(battle.inspecting){ clearInspect(); }
  } else if(battle.mode==='moving'){
    const u = battle.selected;
    const key = x+','+y;
    const clicked = unitAt(x,y);
    const isAdjacentToCurrent = Math.abs(u.x-x)+Math.abs(u.y-y)===1;
    // Direkter Angriff auf einen angrenzenden Gegner, ohne sich zu bewegen.
    if(clicked && clicked.team==='enemy' && isAdjacentToCurrent){
      attackFromCurrentPosition(clicked);
      return;
    }
    if(battle.moveRange && battle.moveRange[key]!==undefined){
      moveSelectedTo(x,y);
    } else {
      if(clicked && clicked.team==='player' && !clicked.hasActed) selectUnit(clicked);
      else deselect();
    }
  } else if(battle.mode==='attacking'){
    const key=x+','+y;
    const u=unitAt(x,y);
    if(u && u.team==='enemy' && battle.attackRange && battle.attackRange.has(key)) performPlayerAttack(u);
  } else if(battle.mode==='spellTargeting'){
    const key=x+','+y;
    const u=unitAt(x,y);
    if(u && battle.attackRange && battle.attackRange.has(key)){
      castSpell(battle.selected, u, battle.castingSpell);
    } else {
      cancelSpellTargeting();
    }
  }
}

/* Rückzug */
function retreatBattle(){
  if(!battle || battle.outcome) return;
  battle.outcome='retreat';
  logMsg('Die Truppe zieht sich vom Schlachtfeld zurück.');
  render();
}

/* Gegnerphase */
function endPlayerPhase(){
  if(!battle || battle.phase!=='player' || battle.outcome) return;
  battle.phase='enemy'; battle.mode='enemy'; battle.selected=null; battle.enemyIdx=0;
  battle.inspecting=null; battle.inspectRange=null; battle.damagePopups=[];
  render();
  setTimeout(runEnemyStep, 400);
}
function runEnemyStep(){
  if(!battle || battle.outcome) return;
  const enemies = battle.units.filter(u=>u.team==='enemy' && u.alive);
  if(battle.enemyIdx>=enemies.length){ finishEnemyPhase(); return; }
  const enemy = enemies[battle.enemyIdx];
  battle.enemyIdx++;
  performEnemyAction(enemy);
  render();
  if(battle.outcome) return;
  setTimeout(runEnemyStep, 400);
}
function performEnemyAction(enemy){
  // -1) Manipulierte Einheiten kämpfen für die Dauer des Effekts gegen die eigenen Kameraden.
  if(enemy.manipulateRounds>0){
    const allies = battle.units.filter(u=>u.team===enemy.team && u.alive && u!==enemy);
    if(allies.length){
      const reachable = computeReachable(enemy);
      let best=null;
      allies.forEach(ally=>{
        [[ally.x,ally.y-1],[ally.x,ally.y+1],[ally.x-1,ally.y],[ally.x+1,ally.y]].forEach(([nx,ny])=>{
          const key=nx+','+ny;
          if(reachable[key]!==undefined){
            if(!best || reachable[key]<best.cost) best={cost:reachable[key], tile:[nx,ny], target:ally};
          }
        });
      });
      if(best){
        if(best.tile[0]!==enemy.x || best.tile[1]!==enemy.y){ enemy.x=best.tile[0]; enemy.y=best.tile[1]; }
        resolveCombat(enemy, best.target);
      } else {
        logMsg(`${enemy.name} kann in seiner Verwirrung niemanden erreichen.`);
      }
    }
    return;
  }
  // 0) Kampfmagier bevorzugen Zaubersprüche: erst Heilung für verwundete Verbündete, dann Feuerball.
  if(enemy.isMage){
    if(enemy.mag>=SPELLS.heilung.cost){
      const healTargets = validSpellTargets(enemy,'heilung').filter(t=>t!==enemy && t.hp<t.maxHp && (t.hp/t.maxHp)<0.5);
      if(healTargets.length){
        healTargets.sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp));
        castSpell(enemy, healTargets[0], 'heilung');
        return;
      }
    }
    if(enemy.mag>=SPELLS.feuerball.cost){
      const atkTargets = validSpellTargets(enemy,'feuerball');
      if(atkTargets.length){
        castSpell(enemy, atkTargets[0], 'feuerball');
        return;
      }
    }
  }
  // 1) Steht die Einheit bereits auf einem besonderen Feld (Wachturm/Burg): halten.
  const standingOn = (battle.specialTiles||[]).find(t=>t.x===enemy.x && t.y===enemy.y);
  const adjNow = adjacentOpponents(enemy);
  if(standingOn){
    if(adjNow.length){ resolveCombat(enemy, adjNow[0]); }
    else { logMsg(`${enemy.name} hält ${TERRAIN[standingOn.type].name}.`); }
    return;
  }
  // 2) Solange unbesetzte Wachtürme/Burg existieren und kein Gegner direkt angrenzt: dorthin vorrücken.
  const unclaimed = (battle.specialTiles||[]).filter(t=>!unitAt(t.x,t.y));
  if(!adjNow.length && unclaimed.length){
    let nearest=null, bestDist=Infinity;
    unclaimed.forEach(t=>{ const d=Math.abs(t.x-enemy.x)+Math.abs(t.y-enemy.y); if(d<bestDist){bestDist=d; nearest=t;} });
    const reachable = computeReachable(enemy);
    let dest=null;
    const directKey = nearest.x+','+nearest.y;
    if(reachable[directKey]!==undefined){ dest=[nearest.x,nearest.y]; }
    else {
      let bestScore=Infinity;
      Object.keys(reachable).forEach(k=>{
        const [x,y]=k.split(',').map(Number);
        const score=Math.abs(nearest.x-x)+Math.abs(nearest.y-y);
        if(score<bestScore){bestScore=score;dest=[x,y];}
      });
    }
    if(dest && (dest[0]!==enemy.x || dest[1]!==enemy.y)){ enemy.x=dest[0]; enemy.y=dest[1]; }
    const stillAdj = adjacentOpponents(enemy);
    if(stillAdj.length){ resolveCombat(enemy, stillAdj[0]); }
    else { logMsg(`${enemy.name} rückt auf ${TERRAIN[nearest.type].name} vor.`); }
    return;
  }
  // 3) Standard reaktive Zonen-KI
  const reachable = computeReachable(enemy);
  const players = battle.units.filter(u=>u.team==='player' && u.alive);
  let best=null; // {cost, tile:[x,y], target}
  for(const p of players){
    const neighbors=[[p.x,p.y-1],[p.x,p.y+1],[p.x-1,p.y],[p.x+1,p.y]];
    for(const [nx,ny] of neighbors){
      const key=nx+','+ny;
      if(reachable[key]!==undefined){
        if(!best || reachable[key]<best.cost) best={cost:reachable[key], tile:[nx,ny], target:p};
      }
    }
  }
  if(!best){ logMsg(`${enemy.name} verharrt auf Position.`); return; }
  if(best.tile[0]!==enemy.x || best.tile[1]!==enemy.y){
    enemy.x=best.tile[0]; enemy.y=best.tile[1];
  }
  resolveCombat(enemy, best.target);
}
function applyTileHealing(){
  battle.units.filter(u=>u.alive).forEach(u=>{
    const t = TERRAIN[battle.grid[u.y][u.x]];
    if(t.heal){
      const before = u.hp;
      u.hp = Math.min(u.maxHp, u.hp+t.heal);
      if(u.hp>before) logMsg(`${u.name} heilt ${u.hp-before} HP auf ${t.name}.`);
    }
  });
}
function tickBuffs(){
  battle.units.forEach(u=>{
    if(u.defBuffRounds>0){
      u.defBuffRounds--;
      if(u.defBuffRounds<=0){ u.defBuffRounds=0; u.defBuff=0; }
    }
    if(u.burnRounds>0 && u.alive){
      const dmg = randInt(1,4);
      u.hp = Math.max(0, u.hp-dmg);
      logMsg(`${u.name} erleidet ${dmg} Feuerschaden.`);
      pushDamagePopup(u.x,u.y,'-'+dmg,'#ff9640');
      u.burnRounds--;
      if(u.hp<=0 && u.alive){ u.alive=false; logMsg(`${u.name} wurde vom Feuer verzehrt.`); playDeathSfx(u); }
    }
    if(u.curseRounds>0 && u.alive){
      const dmg = randInt(4,7);
      u.hp = Math.max(0, u.hp-dmg);
      logMsg(`${u.name} leidet unter dem Todesfluch (${dmg} Schaden).`);
      pushDamagePopup(u.x,u.y,'-'+dmg,'#8a5ea8');
      u.curseRounds--;
      if(u.hp<=0 && u.alive){ u.alive=false; logMsg(`${u.name} erliegt dem Todesfluch.`); playDeathSfx(u); }
    }
    if(u.weakenRounds>0){
      u.weakenRounds--;
      if(u.weakenRounds<=0) removeWeaken(u);
    }
    if(u.manipulateRounds>0){
      u.manipulateRounds--;
    }
  });
  checkBattleEnd();
}
function regenMana(){
  battle.units.forEach(u=>{
    if(u.isMage && u.alive) u.mag = Math.min(u.maxMag, u.mag+1);
  });
}
function finishEnemyPhase(){
  battle.units.forEach(u=>{ u.hasMoved=false; u.hasActed=false; });
  applyTileHealing();
  tickBuffs();
  regenMana();
  battle.phase='player'; battle.mode='idle'; battle.turnNumber++; battle.enemyIdx=0;
  render();
}

/* Kampf-Abschluss -> Weltkonsequenzen */
function endBattle(outcome){
  battle.units.filter(u=>u.team==='player').forEach(u=>{ u.hp=u.maxHp; u.alive=true; u.defBuff=0; u.defBuffRounds=0; if(u.isMage) u.mag=u.maxMag; });
  const loc = battle.loc;
  const win = outcome==='victory';
  if(win){ game.gold += 100; logMsg('Für den erfolgreichen Einsatz erhaltet ihr 100 Gold.'); }
  if(loc.kind==='village'){
    if(win){
      loc.ref.liberated=true;
      loc.ref.occupation=0;
      loc.ref.destroyed=false;
      game.world.villageWinCount++;
      game.world.camps[loc.ref.idx].visible=true;
      logMsg(`${loc.ref.name} wurde befreit. Ein verborgener Banditenstützpunkt wird sichtbar.`);
      grantFirstAllyIfNeeded();
      checkAllyPermanent();
    } else {
      logMsg(`Die Verteidigung von ${loc.ref.name} ist gescheitert.`);
    }
  } else if(loc.kind==='camp'){
    if(win){
      loc.ref.cleared=true;
      logMsg(`${loc.ref.name} wurde ausgehoben.`);
      grantFirstAllyIfNeeded();
      if(loc.ref.idx===2) grantSecondAlly();
      checkAllyPermanent();
    } else {
      logMsg(`Der Angriff auf ${loc.ref.name} ist gescheitert.`);
    }
  } else if(loc.kind==='castle'){
    if(loc.ref.fallen){
      if(win){
        logMsg(`${loc.ref.name} wurde zurückerobert!`);
        // Nach einem Durchbruch macht es keinen Sinn, weitere Burgen einzeln zu befreien:
        // sobald die Rückeroberung gelingt, gilt die gesamte Nordgrenze als gesichert.
        game.world.castles.forEach(c=>{ c.fallen=false; c.siege=0; });
        game.world.activeCastle = game.world.castles.length;
        logMsg('Die Nordgrenze gilt als gesichert.');
        checkNextStageTrigger();
      } else {
        logMsg(`Der Versuch, ${loc.ref.name} zurückzuerobern, ist gescheitert.`);
      }
    } else {
      if(win){
        loc.ref.siege=0;
        logMsg(`${loc.ref.name} wurde erfolgreich verteidigt.`);
        allyLeavesOnCastleDefense();
        if(game.world.activeCastle === loc.ref.idx){
          game.world.activeCastle = loc.ref.idx+1;
          logMsg(`Die Front rückt weiter vor: ${loc.ref.name} ist gesichert.`);
        }
        checkNextStageTrigger();
      } else {
        logMsg(`Die Verteidigung von ${loc.ref.name} ist gescheitert.`);
        advanceCastleSiege(randInt(30,45));
      }
    }
  } else if(loc.kind==='supply'){
    if(win){
      loc.ref.cleared=true;
      loc.ref.clearedAtMonth = game.month;
      logMsg(`${loc.ref.name} wurde ausgehoben.`);
      checkOffensiveCompleted();
    } else {
      logMsg(`Der Angriff auf ${loc.ref.name} ist gescheitert.`);
    }
  } else if(loc.kind==='rumor'){
    if(win){
      loc.ref.cleared=true;
      logMsg(`${loc.ref.name} wurde erkundet.`);
      checkRumorCompleted();
    } else {
      logMsg(`Die Erkundung von ${loc.ref.name} ist gescheitert.`);
    }
  } else if(loc.kind==='feldlager'){
    if(win){
      game.fieldCamp.destroyed = true;
      logMsg('Das feindliche Feldlager wurde zerstört.');
      queueModal('Das feindliche Feldlager wurde zerstört. Die Burgen sind nun endgültig sicher.');
    } else {
      logMsg('Der Angriff auf das feindliche Feldlager ist gescheitert.');
    }
  } else if(loc.kind==='spaeher'){
    if(win){
      game.scoutPatrol.cleared = true;
      logMsg('Der feindliche Spähertrupp wurde ausgeschaltet.');
      queueModal('Nachdem der Spähertrupp ausgeschaltet wurde, sinkt das Risiko von Angriffen auf unsere Befestigungsanlagen.');
    } else {
      logMsg('Der Angriff auf den Spähertrupp ist gescheitert.');
    }
  }
  if(game.rumor && game.rumor.unlocked && loc.kind!=='rumor'){
    game.rumor.actionsSince++;
  }
  // Weltzeit schreitet an der aktiven Frontburg voran, außer man kämpft dort gerade selbst.
  if(!(loc.kind==='castle' && !loc.ref.fallen)){
    const siegeGain = game.world.villageReinforcementsSent ? randInt(15,20) : randInt(25,34);
    advanceCastleSiege(siegeGain);
  }
  game.month++;
  advanceVillageOccupation();
  reactivateSupplyCamps();
  checkNextStageTrigger();
  attemptFieldCampCastleRaid();
  checkPassiveIncome();
  checkGameCompleted();
  battle=null; screen='world'; pendingLocation=null;
  render();
}
function advanceVillageOccupation(){
  // Dörfer, die nicht befreit sind, werden zunehmend von Banditen übernommen — außer alle Lager sind zerstört.
  if(game.world.camps.every(c=>c.cleared)) return;
  game.world.villages.forEach(v=>{
    if(v.liberated) return;
    v.occupation = Math.min(100, (v.occupation||0) + randInt(10,15));
    if(v.occupation>=100 && !v.destroyed){
      v.destroyed = true;
      v.everDestroyed = true;
      logMsg(`${v.name} wurde vollständig zum Banditenstützpunkt.`);
      queueModal(`${v.name} wurde von den Banditen vollständig übernommen. Ihre Zahl ist gewachsen, und die Verstärkung ist deutlich stärker als zuvor.`);
    }
  });
}
function villageStateLabel(v){
  if(v.liberated) return 'Befreit';
  const pct = v.occupation||0;
  if(pct<=0) return 'Sicher';
  if(pct<25) return 'Besetzt';
  if(pct<50) return 'Geplündert';
  if(pct<75) return 'Gebrandschatzt';
  if(pct<100) return 'Einwohner vertrieben';
  return 'Banditenstützpunkt';
}
function reactivateSupplyCamps(){
  // Versorgungslager werden 5 Runden nach ihrer Zerstörung vom Feind erneut errichtet —
  // außer das Feldlager wurde bereits zerstört, dann fehlt die Unterstützung dafür endgültig.
  if(!game.offensive.unlocked) return;
  if(game.fieldCamp && game.fieldCamp.destroyed) return;
  game.offensive.camps.forEach(c=>{
    if(c.cleared && c.clearedAtMonth!=null && (game.month - c.clearedAtMonth) >= 5){
      c.cleared = false;
      c.clearedAtMonth = null;
      logMsg('Der Feind hat das Versorgungslager erneut errichtet.');
      queueModal('Der Feind hat das Versorgungslager erneut errichtet.');
    }
  });
}
function attemptFieldCampCastleRaid(){
  // Solange das Feldlager besteht, kann es auch bereits gesicherte Burgen erneut angreifen —
  // allerdings nur mit einem allmählichen Belagerungsfortschritt von 10-20%/Runde statt eines Sprungs,
  // und nie die Burg, die gerade ohnehin schon aktiv an der Front belagert wird.
  if(!game.fieldCamp || !game.fieldCamp.unlocked || game.fieldCamp.destroyed) return;
  if(game.fieldCamp.raidTargetIdx!=null){
    const castle = game.world.castles[game.fieldCamp.raidTargetIdx];
    if(!castle || castle.fallen || castle.siege<=0){
      game.fieldCamp.raidTargetIdx = null;
    } else {
      castle.siege = Math.min(100, castle.siege + randInt(10,20));
      if(castle.siege>=100){
        castle.fallen = true;
        game.world.activeCastle = Math.min(game.world.activeCastle, castle.idx);
        logMsg(`${castle.name} ist durch einen Überfall aus dem feindlichen Feldlager gefallen!`);
        queueModal(`${castle.name} ist durch einen Überfall aus dem feindlichen Feldlager gefallen!`);
        game.fieldCamp.raidTargetIdx = null;
      }
      return; // pro Runde wird immer nur eine Burg angegriffen
    }
  }
  const chance = game.scoutPatrol.cleared ? 0.20 : 0.30; // Basiswert um 10 Prozentpunkte gesenkt
  if(Math.random() < chance){
    const candidates = game.world.castles.filter(c=> !c.fallen && c.idx!==game.world.activeCastle);
    if(candidates.length){
      const castle = candidates[randInt(0,candidates.length-1)];
      game.fieldCamp.raidTargetIdx = castle.idx;
      castle.siege = Math.min(100, castle.siege + randInt(10,20));
      logMsg(`Truppen aus dem feindlichen Feldlager greifen ${castle.name} an.`);
      queueModal(`Truppen aus dem feindlichen Feldlager greifen ${castle.name} an!`);
    }
  }
}

function checkPassiveIncome(){
  const villagesCampsDone = game.world.villages.every(v=>v.liberated) && game.world.camps.every(c=>c.cleared);
  if(villagesCampsDone){
    const destroyedCount = game.world.villages.filter(v=>v.everDestroyed).length;
    game.gold += Math.max(0, 100 - 25*destroyedCount);
    if(!game.villageIncomeAnnounced){
      game.villageIncomeAnnounced = true;
      game.world.villageReinforcementsSent = true;
      queueModal('Die Bauern sind dankbar für euere Hilfe und überweisen euch jeden Monat 100 Gold als Unterstützung. Die Dörfer sind wieder sicher. Die Dorfbewohner schicken junge wehrfähige Männer mit Vorräten zu den Burgen, um die Festungsanlagen zu verstärken.');
    }
  }
  const castlesSecure = game.world.activeCastle >= game.world.castles.length && game.world.castles.every(c=>!c.fallen);
  if(castlesSecure){
    game.gold += 200;
    if(!game.castleIncomeAnnounced){
      game.castleIncomeAnnounced = true;
      queueModal('Der König ist zufrieden mit eueren Leistungen und unterstützt euch ab sofort monatlich mit 200 Gold.');
    }
  }
}

const appEl = document.getElementById('app');

function render(){
  if(screen==='intro'){
    appEl.innerHTML = renderIntroScreen();
    attachHandlers();
    applyMusic();
    return;
  }
  let html = renderHeader();
  html += '<div id="main">';
  html += renderSidebar();
  html += '<div id="content">';
  if(screen==='world') html += renderWorldScreen();
  if(screen==='battle') html += renderBattleScreen();

  if(screen==='camp') html += renderCampScreen();
  if(screen==='saves') html += renderSavesScreen();
  html += '</div></div>';
  if(screen==='confirm') html += renderConfirmModal();
  if((screen==='world' || screen==='battle') && modalQueue.length) html += renderAnnouncementModal();
  appEl.innerHTML = html;
  attachHandlers();
  if(screen==='battle') drawBattleCanvas();
  applyMusic();
}

function slugify(s){
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/(^-+|-+$)/g,'');
}
function portraitState(u){
  // Bestimmt, welche Bildvariante gerade passend ist:
  // 'agg' beim Angreifen, 'fear' bei kritischem HP-Stand, 'ver' generell im Kampf, sonst neutral.
  if(screen==='battle' && battle){
    if(battle.lastAttackerId === u.id) return 'agg';
    if(u.maxHp>0 && (u.hp/u.maxHp) < 0.25) return 'fear';
    return 'ver';
  }
  return null; // neutral
}
function portraitPath(u){
  const state = portraitState(u);
  return `graphics/portraits/${slugify(u.name)}${state?('_'+state):''}.png`;
}
function neutralPortraitPath(u){ return `graphics/portraits/${slugify(u.name)}.png`; }
function initials(name){ return String(name).trim().split(/\s+/).map(p=>p[0]).join('').slice(0,2).toUpperCase(); }
function portraitImgHtml(u, imgClass, fallbackClass){
  imgClass = imgClass || 'portrait-img';
  fallbackClass = fallbackClass || 'portrait-fallback';
  const statePath = portraitPath(u);
  const neutralPath = neutralPortraitPath(u);
  const fb = (statePath!==neutralPath) ? neutralPath : '';
  return `<img class="${imgClass}" src="${statePath}" data-fallback="${fb}" alt=""
      onerror="var f=this.dataset.fallback; if(f){ this.dataset.fallback=''; this.src=f; } else { this.style.display='none'; this.nextElementSibling.style.display='flex'; }">
    <div class="${fallbackClass}">${initials(u.name)}</div>`;
}

function unitCardHtml(u, opts){
  opts = opts||{};
  const hpPct = Math.max(0, Math.round((u.hp/u.maxHp)*100));
  const xpPct = Math.min(100, u.xp);
  const magPct = (u.isMage && u.maxMag>0) ? Math.max(0, Math.round((u.mag/u.maxMag)*100)) : 0;
  const dead = u.alive===false;
  const buffNote = u.defBuffRounds>0 ? ` (+${u.defBuff}, ${u.defBuffRounds}R)` : '';
  const statusNotes = [];
  if(u.burnRounds>0) statusNotes.push(`🔥${u.burnRounds}`);
  if(u.curseRounds>0) statusNotes.push(`💀${u.curseRounds}`);
  if(u.weakenRounds>0) statusNotes.push(`⬇${u.weakenRounds}`);
  if(u.manipulateRounds>0) statusNotes.push(`🌀${u.manipulateRounds}`);
  return `<div class="roster-card ${dead?'dead':''}">
    <div class="portrait-wrap" title="Porträt-Pfad: ${portraitPath(u)}">
      ${portraitImgHtml(u)}
    </div>
    <div class="card-body">
      <div class="row1">
        <span class="name">${u.name}</span>
        <span class="badge weapon-${u.isMage?'MAGIE':u.weapon}">${u.isMage?'M':WEAPON_LETTER[u.weapon]}</span>
      </div>
      <div class="rank">${u.rank} · Lvl ${u.level} · ${u.isMage?'Magie':WEAPON_NAME[u.weapon]}${dead?' · Kampfunfähig':''}</div>
      <div class="statline-compact">
        <span>ANG ${u.atk}</span><span>VER ${u.def}${buffNote}</span><span>GES ${u.spd}</span>${statusNotes.length?`<span title="Statuseffekte">${statusNotes.join(' ')}</span>`:''}
      </div>
      <div class="stat-row"><span class="stat-label">HP</span><span class="stat-num">${Math.max(0,u.hp)}/${u.maxHp}</span><div class="mini-bar"><div class="mini-bar-fill hp" style="width:${hpPct}%"></div></div></div>
      <div class="stat-row"><span class="stat-label">MP</span><span class="stat-num">${u.isMage?u.mag:0}/${u.isMage?u.maxMag:0}</span><div class="mini-bar"><div class="mini-bar-fill mp" style="width:${magPct}%"></div></div></div>
      ${opts.showXp!==false ? `<div class="stat-row"><span class="stat-label">XP</span><span class="stat-num">${u.xp}/100</span><div class="mini-bar"><div class="mini-bar-fill xp" style="width:${xpPct}%"></div></div></div>` : ''}
    </div>
  </div>`;
}
